[tasks."all:snowflake"]
description = "Run every Snowflake project against the fakesnow emulator (see README.md)"
shell = "bash -euo pipefail -c"

# python-snowflake embeds fakesnow in-process, so it runs before the shared server is started and does not
# need it. The trap stops the server whether or not the remaining projects pass.
run = """
mise run test:python-snowflake
mise run snowflake:emulator:up
trap 'mise run snowflake:emulator:down' EXIT
for project in typescript-snowflake go-gosnowflake java-jdbc-snowflake kotlin-jdbc-snowflake csharp-snowflake php-pdo-snowflake; do
  mise run "test:$project"
done
"""
