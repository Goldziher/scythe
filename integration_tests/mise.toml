# Integration-test tasks. Run them from this directory (`cd integration_tests && mise run <task>`, or
# `mise -C integration_tests run <task>` from the repository root): the [env] below points every harness at
# the docker-compose services and applies only under integration_tests/. Tools come from the root mise.toml.

[env]
DATABASE_URL = "postgres://scythe:scythe@localhost:5433/scythe_test"
MYSQL_URL = "mysql://scythe:scythe@127.0.0.1:3307/scythe_test"
MARIADB_URL = "mysql://scythe:scythe@127.0.0.1:3308/scythe_test"
ORACLE_URL = "oracle://scythe:scythe@localhost:1521/XEPDB1"
SQLITE_PATH = "/tmp/scythe_test.db"
DATABASE_PATH = "/tmp/scythe_test.db"
# DuckDB is embedded like SQLite, but every harness opens its own in-memory (":memory:") connection instead
# of a shared file -- the schema's unconditional CREATE SEQUENCE statements would fail on a second run
# against the same on-disk file. This var exists for parity with the other embedded engines and so a harness
# can still be pointed at a real file for local debugging.
DUCKDB_PATH = ":memory:"
MSSQL_URL = "sqlserver://sa:Scythe_Test1@localhost:1433?database=master"
# Points at the `redshift-pg-compat` compose service, i.e. PostgreSQL with a substituted schema -- not
# Redshift. See docker-compose.yml.
REDSHIFT_URL = "postgres://scythe:scythe@localhost:5434/scythe_redshift_test"
# Points at the fakesnow emulator started by `mise run snowflake:emulator:up`, i.e. DuckDB behind a
# Snowflake REST facade -- not Snowflake.
SNOWFLAKE_URL = "snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http"

[vars]
# gosnowflake takes a DSN, not a URL, and needs insecureMode for plain HTTP.
snowflake_go_dsn = "fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http&insecureMode=true"

[tasks."db:up"]
description = "Start database containers"
run = 'docker compose up -d --wait'

[tasks."db:down"]
description = "Stop database containers"
run = 'docker compose down -v'

[tasks."db:migrate"]
description = "Run PG schema migration"
run = 'PGPASSWORD=scythe psql -h localhost -p 5433 -U scythe -d scythe_test -f sql/pg/schema.sql'

[tasks."db:migrate:mysql"]
description = "Run MySQL schema migration"
run = 'mysql -h 127.0.0.1 -P 3307 -u scythe -pscythe scythe_test < sql/mysql/schema.sql'

[tasks."db:migrate:mariadb"]
description = "Run MariaDB schema migration"
run = 'mysql -h 127.0.0.1 -P 3308 -u scythe -pscythe scythe_test < sql/mariadb/schema.sql'

[tasks."db:migrate:redshift"]
description = "Apply the PG-compat Redshift schema to the redshift-pg-compat service"
run = 'PGPASSWORD=scythe psql -h localhost -p 5434 -U scythe -d scythe_redshift_test -f sql/redshift/schema_pg_compat.sql'

[tasks."db:migrate:mssql"]
description = "Run MSSQL schema migration"
run = "docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Scythe_Test1 -C -b -i /dev/stdin < sql/mssql/schema.sql"

[tasks."snowflake:emulator:up"]
description = "Start the fakesnow emulator the snowflake test:* targets talk to"
dir = "{{config_root}}/fakesnow"
run = """
set -e
uv run fakesnow_server.py &
echo $! > /tmp/scythe-fakesnow.pid
curl --retry 30 --retry-all-errors --retry-delay 1 --silent --output /dev/null http://127.0.0.1:64616/
"""

[tasks."snowflake:emulator:down"]
description = "Stop the fakesnow emulator"
run = [
  'kill "$(cat /tmp/scythe-fakesnow.pid)"',
  'rm -f /tmp/scythe-fakesnow.pid',
]

[tasks."db:reset"]
description = "Drop and recreate all tables"
run = [
  'PGPASSWORD=scythe psql -h localhost -p 5433 -U scythe -d scythe_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"',
  { task = "db:migrate" },
]

[tasks."generate:scaffolding"]
description = "Regenerate project scaffolding and test harnesses from the jinja templates"
dir = "{{config_root}}/.."
run = 'cargo run --quiet -p integration-test-generator'

[tasks."generate:all"]
description = "Regenerate scaffolding and then backend code"
run = [
  { task = "generate:scaffolding" },
  { task = "generate" },
]

# Build the workspace scythe-cli binary in release mode. `generate` invokes the resulting binary by absolute
# path instead of the bare `scythe` command, so regeneration always uses the working tree's compiler even if
# an older `scythe` release is first on $PATH (see issue #85). Cargo no-ops here when the binary is already
# up to date, so depending task-graphs pay this cost once, not once per backend.
[tasks."build:scythe"]
description = "Build the workspace scythe-cli binary in release mode"
dir = "{{config_root}}/.."
run = "cargo build --release -p scythe-cli"

# The backend list comes from the generator's own `build_backends()` (via `--list`), not a hand-maintained
# copy, so this task can never drift from what `generate:scaffolding` actually produces. See
# tools/integration-test-generator/src/main.rs and integration_tests/README.md for the 3 directories
# intentionally excluded because they are hand-maintained outside the generator.
#
# HAND_MAINTAINED own their scythe.toml by hand (they pin one-off codegen options, or in
# rust-sqlx-nested-json's case a schema and dependency set the generator has no template for), but their
# query code still comes from `scythe generate`, so it drifts like any other generated output and belongs in
# this loop. Omitting one does not fail anything loudly: its committed code simply stops tracking the
# generator, which is how rust-sqlx-nested-json came to still carry the pre-0.14.0 banner and no provenance
# header while every other artifact had moved on.
#
# The binary is invoked by absolute path, from the target directory `build:scythe` built into: CARGO_TARGET_DIR
# when set (relative to the repository root, where cargo ran), else the repository's target/.
[tasks.generate]
description = "Regenerate code for all backends"
depends = ["build:scythe"]
shell = "bash -euo pipefail -c"
env = { HAND_MAINTAINED = "kotlin-jdbc-ext php-pdo-namespace rust-sqlx-nested-json" }
run = """
target_dir="${CARGO_TARGET_DIR:-target}"
case "$target_dir" in
/*) ;;
*) target_dir="$(cd .. && pwd)/$target_dir" ;;
esac
scythe_bin="$target_dir/release/scythe"
backends=$(cd .. && cargo run --quiet -p integration-test-generator -- --list)
for backend in $backends $HAND_MAINTAINED; do
  (cd "$backend" && "$scythe_bin" generate)
done
"""

