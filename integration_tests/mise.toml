# Every `pnpm install` below is a bare `--frozen-lockfile`, with no
# `2>/dev/null || pnpm install` fallback. That fallback used to sit on all 17
# of them, and it turned the one thing `--frozen-lockfile` exists to do into
# a no-op: the flag's entire job is to exit non-zero when pnpm-lock.yaml has
# drifted from package.json, and `|| pnpm install` caught exactly that exit,
# then *rewrote the lockfile* to match. So a drifted lockfile produced a
# green run and a dirty working tree instead of a failure -- against a
# dependency set nobody had reviewed, in a repository whose policy is that
# every lock file is committed. Verified by adding a dependency to
# typescript-pg/package.json without relocking: the fallback form exited 0
# (and edited pnpm-lock.yaml), the bare form exited 1 with
# ERR_PNPM_OUTDATED_LOCKFILE.
#
# If this now fails, the fix is `mise -C .. run update:integration` (or
# `pnpm install --lockfile-only` in the offending project) and committing the
# resulting lockfile -- not restoring the fallback.
[tasks."test:typescript-postgres"]
description = "Run typescript-postgres integration test"
dir = "{{config_root}}/typescript-postgres"
run = [
  'pnpm install --frozen-lockfile',
  'pnpm exec tsc --noEmit',
  'pnpm exec tsx test.ts',
]

