version: "3"

vars:
  DATABASE_URL: "postgres://scythe:scythe@localhost:5433/scythe_test"
  MYSQL_URL: "mysql://scythe:scythe@127.0.0.1:3307/scythe_test"
  MARIADB_URL: "mysql://scythe:scythe@127.0.0.1:3308/scythe_test"
  ORACLE_URL: "oracle://scythe:scythe@localhost:1521/XEPDB1"
  SQLITE_PATH: "/tmp/scythe_test.db"
  MSSQL_URL: "sqlserver://sa:Scythe_Test1@localhost:1433?database=master"
  # Points at the `redshift-pg-compat` compose service, i.e. PostgreSQL with a
  # substituted schema -- not Redshift. See docker-compose.yml.
  REDSHIFT_URL: "postgres://scythe:scythe@localhost:5434/scythe_redshift_test"
  # Points at the fakesnow emulator started by `task snowflake:emulator:up`,
  # i.e. DuckDB behind a Snowflake REST facade -- not Snowflake.
  SNOWFLAKE_URL: "snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http"
  # gosnowflake takes a DSN, not a URL, and needs insecureMode for plain HTTP.
  SNOWFLAKE_GO_DSN: "fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http&insecureMode=true"

env:
  DATABASE_URL: "{{.DATABASE_URL}}"
  MYSQL_URL: "{{.MYSQL_URL}}"
  MARIADB_URL: "{{.MARIADB_URL}}"
  ORACLE_URL: "{{.ORACLE_URL}}"
  SQLITE_PATH: "{{.SQLITE_PATH}}"
  DATABASE_PATH: "{{.SQLITE_PATH}}"
  MSSQL_URL: "{{.MSSQL_URL}}"
  REDSHIFT_URL: "{{.REDSHIFT_URL}}"
  SNOWFLAKE_URL: "{{.SNOWFLAKE_URL}}"

tasks:
  db:up:
    desc: Start database containers
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop database containers
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker compose down -v

  db:migrate:
    desc: Run PG schema migration
    cmds:
      - PGPASSWORD=scythe psql -h localhost -p 5433 -U scythe -d scythe_test -f sql/pg/schema.sql

  db:migrate:mysql:
    desc: Run MySQL schema migration
    cmds:
      - mysql -h 127.0.0.1 -P 3307 -u scythe -pscythe scythe_test < sql/mysql/schema.sql

  db:migrate:mariadb:
    desc: Run MariaDB schema migration
    cmds:
      - mysql -h 127.0.0.1 -P 3308 -u scythe -pscythe scythe_test < sql/mariadb/schema.sql

  db:migrate:redshift:
    desc: Apply the PG-compat Redshift schema to the redshift-pg-compat service
    cmds:
      - PGPASSWORD=scythe psql -h localhost -p 5434 -U scythe -d scythe_redshift_test -f sql/redshift/schema_pg_compat.sql

  db:migrate:mssql:
    desc: Run MSSQL schema migration
    cmds:
      - >-
        docker compose exec -T mssql /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P Scythe_Test1 -C -b -i /dev/stdin < sql/mssql/schema.sql

  snowflake:emulator:up:
    desc: Start the fakesnow emulator the snowflake test:* targets talk to
    dir: fakesnow
    cmds:
      - |
        set -e
        uv run fakesnow_server.py &
        echo $! > /tmp/scythe-fakesnow.pid
        curl --retry 30 --retry-all-errors --retry-delay 1 --silent --output /dev/null http://127.0.0.1:64616/

  snowflake:emulator:down:
    desc: Stop the fakesnow emulator
    cmds:
      - kill "$(cat /tmp/scythe-fakesnow.pid)"
      - rm -f /tmp/scythe-fakesnow.pid

  db:reset:
    desc: Drop and recreate all tables
    cmds:
      - PGPASSWORD=scythe psql -h localhost -p 5433 -U scythe -d scythe_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
      - task: db:migrate

  generate:scaffolding:
    desc: Regenerate project scaffolding and test harnesses from the jinja templates
    dir: ..
    cmds:
      - cargo run --quiet -p integration-test-generator

  generate:all:
    desc: Regenerate scaffolding and then backend code
    cmds:
      - task: generate:scaffolding
      - task: generate

  build:scythe:
    desc: >-
      Build the workspace scythe-cli binary in release mode. `generate` invokes
      the resulting binary by absolute path instead of the bare `scythe`
      command, so regeneration always uses the working tree's compiler even if
      an older `scythe` release is first on $PATH (see issue #85). Cargo
      no-ops here when the binary is already up to date, so depending
      task-graphs pay this cost once, not once per backend.
    dir: ..
    cmds:
      - cargo build --release -p scythe-cli

  generate:
    desc: Regenerate code for all backends
    deps:
      - build:scythe
    vars:
      # The backend list comes from the generator's own `build_backends()`
      # (via `--list`), not a hand-maintained copy, so this task can never
      # drift from what `generate:scaffolding` actually produces. See
      # tools/integration-test-generator/src/main.rs and
      # integration_tests/README.md for the 9 directories intentionally
      # excluded because they are hand-maintained outside the generator.
      BACKENDS:
        sh: cd .. && cargo run --quiet -p integration-test-generator -- --list
      # These own their scythe.toml by hand (they pin one-off codegen options,
      # or in rust-sqlx-nested-json's case a schema and dependency set the
      # generator has no template for), but their query code still comes from
      # `scythe generate`, so it drifts like any other generated output and
      # belongs in this loop. Omitting one does not fail anything loudly: its
      # committed code simply stops tracking the generator, which is how
      # rust-sqlx-nested-json came to still carry the pre-0.14.0 banner and no
      # provenance header while every other artifact had moved on.
      HAND_MAINTAINED: kotlin-jdbc-ext php-pdo-namespace rust-sqlx-nested-json
      # Absolute path to the just-built workspace binary. TASKFILE_DIR (this
      # directory) rather than ROOT_DIR is deliberate: it always resolves
      # relative to where this Taskfile lives, even if it's ever included
      # from another Taskfile where ROOT_DIR would point elsewhere.
      SCYTHE_BIN: "{{.TASKFILE_DIR}}/../target/release/scythe"
    cmds:
      - for: { var: BACKENDS, split: "\n" }
        cmd: cd {{.ITEM}} && {{.SCYTHE_BIN}} generate
      - for: { var: HAND_MAINTAINED }
        cmd: cd {{.ITEM}} && {{.SCYTHE_BIN}} generate

