    desc: Run kotlin-jdbc-mssql integration test
    dir: kotlin-jdbc-mssql
    cmds:
      - gradle run --quiet

  test:csharp-sqlclient-mssql:
    desc: Run csharp-sqlclient-mssql integration test
    dir: csharp-sqlclient-mssql
    cmds:
      - dotnet run

  test:ruby-tiny-tds-mssql:
    desc: Run ruby-tiny-tds-mssql integration test
    dir: ruby-tiny-tds-mssql
    cmds:
      - bundle install --quiet
      - bundle exec ruby test_integration.rb

  test:php-pdo-mssql:
    desc: Run php-pdo-mssql integration test
    dir: php-pdo-mssql
    cmds:
      - php test_integration.php

  # --- Redshift backends ---
  #
  # These run against the `redshift-pg-compat` compose service -- stock
  # PostgreSQL with sql/redshift/schema_pg_compat.sql, in which IDENTITY was
  # substituted for SERIAL and GETDATE() for NOW(). They are not Redshift and
  # cannot show the divergences listed in README.md; run
  # `task db:migrate:redshift` first.
  test:rust-sqlx-redshift:
    desc: Run rust-sqlx-redshift integration test (PG-compat substitute)
    dir: rust-sqlx-redshift
    cmds:
      - cargo run --quiet

  test:rust-tokio-postgres-redshift:
    desc: Run rust-tokio-postgres-redshift integration test (PG-compat substitute)
    dir: rust-tokio-postgres-redshift
    cmds:
      - cargo run --quiet

  test:python-psycopg3-redshift:
    desc: Run python-psycopg3-redshift integration test (PG-compat substitute)
    dir: python-psycopg3-redshift
    cmds:
      - uv run python test_integration.py

  test:python-asyncpg-redshift:
    desc: Run python-asyncpg-redshift integration test (PG-compat substitute)
    dir: python-asyncpg-redshift
    cmds:
      - uv run python test_integration.py

  test:go-pgx-redshift:
    desc: Run go-pgx-redshift integration test (PG-compat substitute)
    dir: go-pgx-redshift
    cmds:
      - go mod tidy
      - go run .

  test:typescript-pg-redshift:
    desc: Run typescript-pg-redshift integration test (PG-compat substitute)
    dir: typescript-pg-redshift
    cmds:
      - pnpm install --frozen-lockfile 2>/dev/null || pnpm install
      - pnpm exec tsc --noEmit
      - pnpm exec tsx test.ts

  test:typescript-postgres-redshift:
    desc: Run typescript-postgres-redshift integration test (PG-compat substitute)
    dir: typescript-postgres-redshift
    cmds:
      - pnpm install --frozen-lockfile 2>/dev/null || pnpm install
      - pnpm exec tsc --noEmit
      - pnpm exec tsx test.ts

  test:java-jdbc-redshift:
    desc: Run java-jdbc-redshift integration test (PG-compat substitute)
    dir: java-jdbc-redshift
    cmds:
      - mvn -q compile exec:java

  test:kotlin-jdbc-redshift:
    desc: Run kotlin-jdbc-redshift integration test (PG-compat substitute)
    dir: kotlin-jdbc-redshift
    cmds:
      - gradle run --quiet

  test:csharp-npgsql-redshift:
    desc: Run csharp-npgsql-redshift integration test (PG-compat substitute)
    dir: csharp-npgsql-redshift
    cmds:
      - dotnet run

  test:elixir-postgrex-redshift:
    desc: Run elixir-postgrex-redshift integration test (PG-compat substitute)
    dir: elixir-postgrex-redshift
    cmds:
      - mix deps.get --quiet
      - mix run test/integration_test.exs

  test:ruby-pg-redshift:
    desc: Run ruby-pg-redshift integration test (PG-compat substitute)
    dir: ruby-pg-redshift
    cmds:
      - bundle install --quiet
      - bundle exec ruby test_integration.rb

  test:php-pdo-redshift:
    desc: Run php-pdo-redshift integration test (PG-compat substitute)
    dir: php-pdo-redshift
    cmds:
      - php test_integration.php

  # --- Snowflake backends ---
  #
  # These run against fakesnow (DuckDB behind a Snowflake REST facade), not
  # Snowflake. Start it with `task snowflake:emulator:up` first, except for
  # python-snowflake, which embeds fakesnow in-process.
  test:python-snowflake:
    desc: Run python-snowflake integration test (fakesnow emulator)
    dir: python-snowflake
    env:
      SNOWFLAKE_USE_FAKESNOW: "1"
    cmds:
      - uv run python test_integration.py

  test:typescript-snowflake:
    desc: Run typescript-snowflake integration test (fakesnow emulator)
    dir: typescript-snowflake
    cmds:
      - pnpm install --frozen-lockfile 2>/dev/null || pnpm install
      - pnpm exec tsc --noEmit
      - pnpm exec tsx test.ts

  test:go-gosnowflake:
    desc: Run go-gosnowflake integration test (fakesnow emulator)
    dir: go-gosnowflake
    env:
      # gosnowflake takes a DSN rather than a URL; see the SNOWFLAKE_GO_DSN var.
      SNOWFLAKE_URL: "{{.SNOWFLAKE_GO_DSN}}"
    cmds:
      - go mod tidy
      - go run .

  test:java-jdbc-snowflake:
    desc: Run java-jdbc-snowflake integration test (fakesnow emulator)
    dir: java-jdbc-snowflake
    cmds:
      - mvn -q compile exec:java

  test:kotlin-jdbc-snowflake:
    desc: Run kotlin-jdbc-snowflake integration test (fakesnow emulator)
    dir: kotlin-jdbc-snowflake
    cmds:
      - gradle run --quiet

  test:csharp-snowflake:
