    dir: csharp-snowflake
    cmds:
      - dotnet run

  test:php-pdo-snowflake:
    desc: Run php-pdo-snowflake integration test (fakesnow emulator)
    dir: php-pdo-snowflake
    cmds:
      - php test_integration.php

