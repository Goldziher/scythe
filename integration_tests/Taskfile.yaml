  test:typescript-pg-structs-only:
    desc: Type-check typescript-pg-structs-only and assert its structural shape (no driver import, no query functions)
    dir: typescript-pg-structs-only
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec tsc --noEmit
      - pnpm exec tsx test.ts
      - task: structs-only-check

  structs-only-check:
    internal: true
    dir: typescript-pg-structs-only
    cmds:
      - |
        set -e
        if grep -q 'from "pg"' generated/queries.ts; then
          echo "FAIL: structs_only output must not import the pg driver" >&2
          exit 1
        fi
        if grep -qE '^export async function ' generated/queries.ts; then
          echo "FAIL: structs_only output must not emit query functions" >&2
          exit 1
        fi
        for symbol in "export interface GetUserByIdRow" "export const UserStatusValues"; do
          if ! grep -qF "$symbol" generated/queries.ts; then
            echo "FAIL: structs_only output must still emit '$symbol'" >&2
            exit 1
          fi
        done
        echo "PASS: structs_only output has no driver import, no query functions, and keeps type declarations"

