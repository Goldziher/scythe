[advisories]
# ~keep RUSTSEC-2024-0449 (unsafe-libyaml unmaintained, no advisory against
# ~keep scythe itself) arrives through sqruff-lib-dialects' serde_yaml 0.9, which
# ~keep scythe does not control: it is unmaintained, not vulnerable, and it only
# ~keep parses the dialect YAML shipped inside sqruff. `-D advisory-not-detected`
# ~keep in CI fails this file the moment the entry stops matching, so the ignore
# ~keep cannot outlive the dependency.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # ~keep tiny-keccak via DuckDB's Arrow stack; public-domain-equivalent and OSI-approved.
  "CC0-1.0",
  # ~keep webpki-roots is used only while building bundled libduckdb; permissive data license.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
