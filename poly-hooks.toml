version = 1

[[hooks]]
id = "scythe-fmt"
stages = ["pre-commit"]
args = ["fmt"]
files = ["*.sql", "**/*.sql"]
pass_filenames = true

[[hooks.paths]]
channel = "system"
check = "command -v scythe"
run = "scythe"

[[hooks.paths]]
channel = "cargo"
check = "test \"$(\"${CARGO_HOME:-$HOME/.cargo}/bin/scythe\" --version 2>/dev/null)\" = \"scythe 0.18.0\""
install = "cargo install --locked scythe-cli --version 0.18.0"
run = "\"${CARGO_HOME:-$HOME/.cargo}/bin/scythe\""

[[hooks]]
id = "scythe-lint"
stages = ["pre-commit"]
args = ["lint", "--fix"]
files = ["*.sql", "**/*.sql"]
pass_filenames = true

[[hooks.paths]]
channel = "system"
check = "command -v scythe"
