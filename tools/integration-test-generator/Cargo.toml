[package]
name = "integration-test-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Integration test generator for scythe — renders language-specific tests from templates"
repository = "https://github.com/Goldziher/scythe"
authors = ["Na'aman Hirschfeld"]

[dependencies]
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["loader"] }
# build_backends() cross-checks its own list against crates/scythe-codegen/manifests
# by resolving each entry through the real generator, the same way
# tests/coverage_completeness.rs does, rather than re-deriving the engine-fallback
# table (see issue #134). That is a runtime check in the binary itself, not just
# the test suite, so both crates are ordinary dependencies here.
scythe-codegen = { path = "../../crates/scythe-codegen" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
