required_version = ">=0.36.1"
# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  # ~keep Native ai-rulez provenance and runtime tests verify these generated bundles.
  "plugin/.ai-rulez-generated.json",
  "plugin/GEMINI.md",
  "plugin/.ai-rulez.bak-okf-*/**",
  ".ai-rulez.bak-okf-*/**",
  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.hermes/**",
  "plugin/.opencode/**",
  "plugin/.pi/**",
  "plugin/skills/**",
  "plugin/plugin.json",
  "plugin/package.json",
  "plugin/kimi.plugin.json",
  "plugin/gemini-extension.json",
  "plugin/README.md",
  "/skills/**",
  ".agents/plugins/**",
  ".claude-plugin/**",

  "**/*.lock",
  "**/*.svg",
  "**/*.jinja",
  # cargo-sort (run by `poly lint`) rewrites Cargo.toml arrays with a 4-space
  # indent, while poly's taplo formatter insists on 2. The two rewrite each
  # other forever, and CI's `poly fmt --check` has gone red four times because
  # of it. cargo-sort owns Cargo.toml; keep poly's formatter off it.
  "Cargo.toml",
  "**/Cargo.toml",
  "tests/schemas/**",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "artifacts/**",
  "dist/**",
  "integration_tests/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "integration_tests",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[engines.ruff.lint]
target_version = "py312"
line_length = 120

[engines.rumdl.lang.markdown]
disable = ["MD025", "MD012", "MD013", "MD024", "MD030", "MD033", "MD035", "MD036", "MD041", "MD046", "MD051", "MD076"]

[engines.typos]
# typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true
extend_words = { optionall = "optionall", emial = "emial", onl = "onl", togehter = "togehter", recommented = "recommented", CHECKs = "CHECKs", SELCT = "SELCT", SELECTs = "SELECTs", ba = "ba", inh = "inh", statu = "statu" }
extend_exclude = [
  "go.sum",
  "**/go.sum",
  "**/go.mod",
  "Cargo.lock",
  "**/Cargo.lock",
  "pnpm-lock.yaml",
  "**/pnpm-lock.yaml",
  "package-lock.json",
  "**/package-lock.json",
]
# NOTE: typos extend-ignore-re is NOT portable to poly (no regex-based ignore support).
extend_ignore_words = [
  "optionall",
  "emial",
  "onl",
  "togehter",
  "recommented",
  "CHEC",
  "SELEC",
  "CHECKs",
  "SELCT",
  "SELECTs",
  "ba",
  "inh",
  "statu",
]

[engines.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/*.jinja",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "artifacts/**",
  "dist/**",
  "integration_tests/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
cargo = true

lint = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "artifacts/**",
  "dist/**",
  "integration_tests/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/*.jinja",
  # See the [discovery] exclude: cargo-sort owns Cargo.toml formatting.
  "Cargo.toml",
  "**/Cargo.toml",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "artifacts/**",
  "dist/**",
  "integration_tests/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true


[per_file_ignores]
# ~keep Throwaway database passwords in connection URLs for the local and CI database containers.
".github/workflows/**" = ["secrets/betterleaks.generic-credential-uri"]
"website/src/content/docs/**" = ["secrets/betterleaks.generic-credential-uri"]
"crates/*/src/**" = ["secrets/betterleaks.generic-credential-uri"]
"crates/*/tests/**" = ["secrets/betterleaks.generic-credential-uri"]
# ~keep Command-line scripts report through stdout.
"scripts/**" = ["T201"]
# ~keep Ambient driver stubs reproduce the shapes of the real typings (any, classes) on purpose.
"crates/scythe-codegen/tests/js_mode_stubs/*.d.ts" = [
  "typescript/no-explicit-any",
  "typescript/no-extraneous-class",
  "no-redeclare",
]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"website/src/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]
[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[engines.python-types]
backend = "pyrefly"
python_version = "3.12"
src = ["scripts"]

[engines.secrets]
enabled = true
