[workspace]
resolver = "3"
members = [
    "crates/scythe-backend",
    "crates/scythe-cli",
    "crates/scythe-codegen",
    "crates/scythe-conformance",
    "crates/scythe-core",
    "crates/scythe-inspect",
    "crates/scythe-lint",
    "tools/integration-test-generator",
    "tools/migrate-fixtures",
    "tools/snippet-runner",
    "tools/test-generator",
]

[profile.release]
# ~keep Strip symbols from the shipped CLI. The release archives are ~80 MB because
# ~keep bundled DuckDB dominates them; without stripping, the manylinux build was
# ~keep 95.6 MB against a 78.6 MB ratchet, and the symbols benefit nobody who runs
# ~keep the binary rather than debug it.
strip = "symbols"
