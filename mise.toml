# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned by
# rust-toolchain.toml, not here. macos-x64 is locked for the x86_64-apple-darwin release builds. CI selects
# the older language lines some jobs run on from mise.ci.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]

[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26.12.1"
pnpm = "12.11.2"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
gradle = "9.8.2"
ruby = "3.4.12"
"github:Goldziher/poly" = "0.31.2"
cargo-deny = "0.20.2"
actionlint = "1.7.12"
