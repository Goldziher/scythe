version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize project. Idempotent."
    cmds:
      - cargo fetch
      - poly hooks install
      - echo "Setup complete"

  build:
    desc: Build release binary
    cmds:
      - cargo build --workspace --release

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test --workspace -- --nocapture

  bench:
    desc: Run criterion benchmarks
    cmds:
      - cargo bench --workspace

  lint:
    desc: Run all linters via poly
    cmds:
      - poly lint .

  format:
    desc: Format all code via poly
    cmds:
      - poly fmt --fix .

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  snippets:build:
    desc: Build the snippet-runner tool
    cmds:
      - cargo build -p snippet-runner --release

  snippets:list:
    desc: List all documentation snippets
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner list -s website/snippets -r website/src/content/docs

  snippets:validate:
    desc: Validate documentation snippets (syntax level)
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/snippets -r website/src/content/docs -L syntax

  snippets:validate:compile:
    desc: Validate documentation snippets (compile level)
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/snippets -r website/src/content/docs -L compile

  snippets:validate:lang:
    desc: Validate specific language snippets
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/snippets -r website/src/content/docs -L {{.LEVEL | default "syntax"}} -l {{.LANGUAGES}}
    requires:
      vars: [LANGUAGES]

  docs:build:
    desc: Build the documentation site
    cmds:
      - npm --prefix website install
      - npm --prefix website run build

  docs:serve:
    desc: Run the documentation site locally with live reload
    cmds:
      - npm --prefix website install
      - npm --prefix website run dev

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  version:sync:
    desc: "Update all package versions to the given VERSION"
    requires:
      vars: [VERSION]
    cmds:
      # Every published crate must appear in both substitutions and in the
      # second one's alternation. scythe-inspect was missing from all three,
      # so its own version and every pin on it silently kept the old value --
      # and because `publish_crates` tolerates an "already exists" error, the
      # release succeeded green while shipping five crates instead of six.
      # `version:check` below is the guard that makes a recurrence loud.
      - sed -i '' 's/^version = ".*"/version = "{{.VERSION}}"/' crates/scythe-cli/Cargo.toml crates/scythe-core/Cargo.toml crates/scythe-codegen/Cargo.toml crates/scythe-backend/Cargo.toml crates/scythe-lint/Cargo.toml crates/scythe-inspect/Cargo.toml
      - sed -i '' -E 's/(scythe-(core|codegen|backend|lint|cli|inspect).*version = ")[^"]*"/\1{{.VERSION}}"/' crates/scythe-cli/Cargo.toml crates/scythe-codegen/Cargo.toml crates/scythe-lint/Cargo.toml crates/scythe-inspect/Cargo.toml
      - task: version:check
      - cargo check --workspace 2>/dev/null || true
      - echo "All crate versions updated to {{.VERSION}}"

  version:check:
    desc: "Fail if any published crate's version or inter-crate pin has drifted"
    silent: true
    cmds:
      # Portable (no BSD sed) so this can gate CI on Linux, unlike version:sync.
      # Violations are accumulated in a variable rather than setting a flag
      # inside a `... | while read` -- a pipeline runs its loop in a subshell,
      # so the flag is lost and the check reports drift while still exiting 0.
      - |
        expected=$(awk -F'"' '/^version = /{print $2; exit}' crates/scythe-cli/Cargo.toml)
        violations=""
        for f in crates/*/Cargo.toml; do
          own=$(awk -F'"' '/^version = /{print $2; exit}' "$f")
          if [ "$own" != "$expected" ]; then
            violations="${violations}version drift: $f declares $own, expected $expected\n"
          fi
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            if [ "$v" != "$expected" ]; then
              violations="${violations}pin drift: $f pins a scythe crate at $v, expected $expected\n"
            fi
          done <<PINS
        $(grep -oE 'scythe-[a-z]+ = \{[^}]*version = "[^"]*"' "$f" | sed -E 's/.*version = "([^"]*)"/\1/')
        PINS
        done
        if [ -n "$violations" ]; then
          printf "%b" "$violations" >&2
          exit 1
        fi
        echo "All crate versions and pins agree on $expected"

  update:
    desc: Update dependencies (workspace + dev tooling + integration tests)
    cmds:
      - cargo upgrade --incompatible
      - cargo update
      - uv lock --upgrade
      - task: update:integration
      # cargo rewrites Cargo.toml with its own 4-space indent, which poly then
      # rejects. Reformat here so a dependency bump cannot leave CI red.
      - poly fmt --fix .

  update:integration:
    desc: Update lock files in all integration test projects
    cmds:
      - for f in integration_tests/*/Cargo.lock; do (cd "${f%/*}" && cargo update); done
      - for f in integration_tests/*/uv.lock; do (cd "${f%/*}" && uv lock --upgrade); done
      - for f in integration_tests/*/pnpm-lock.yaml; do (cd "${f%/*}" && pnpm update --lockfile-only); done
      - for f in integration_tests/*/go.sum; do (cd "${f%/*}" && go get -u ./... && go mod tidy); done
      - for f in integration_tests/*/Gemfile.lock; do (cd "${f%/*}" && bundle lock --update); done
      - for f in integration_tests/*/mix.lock; do (cd "${f%/*}" && mix deps.update --all); done
      - for f in integration_tests/*/composer.lock; do (cd "${f%/*}" && composer update --no-install); done
