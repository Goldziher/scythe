version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize project. Idempotent."
    cmds:
      - cargo fetch
      - poly hooks install
      - echo "Setup complete"

  build:
    desc: Build release binary
    cmds:
      - cargo build --workspace --release

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test --workspace -- --nocapture

  bench:
    desc: Run criterion benchmarks
    cmds:
      - cargo bench --workspace

  lint:
    desc: Run all linters via poly
    cmds:
      - poly lint .

  format:
    desc: Format all code via poly
    cmds:
      - poly fmt --fix .

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  generated:check-syntax:
    desc: "Compile/type-check every committed generated file under integration_tests/ (harnesses + query code)"
    cmds:
      - ./scripts/check-generated-syntax.sh

  generated:check-syntax:harness:
    desc: "Syntax-check only the hand-written harnesses under integration_tests/ (subset of generated:check-syntax)"
    cmds:
      - ./scripts/check-generated-syntax.sh --harness-only

  generated:check-torture:
    desc: "Regenerate every postgresql-engine backend against sql/torture/schema.sql and real-build-check it (issue #146)"
    cmds:
      - cargo build --release -p scythe-cli
      - python3 scripts/check-generated-backends.py

  snippets:build:
    desc: Build the snippet-runner tool
    cmds:
      - cargo build -p snippet-runner --release

  snippets:list:
    desc: List all documentation snippets
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner list -s website/src/content/docs README.md

  snippets:validate:
    desc: Validate documentation snippets (syntax level)
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/src/content/docs README.md -L syntax

  snippets:validate:compile:
    desc: Validate documentation snippets (compile level)
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/src/content/docs README.md -L compile

  snippets:validate:lang:
    desc: Validate specific language snippets
    deps: [snippets:build]
    cmds:
      - ./target/release/snippet-runner validate -s website/src/content/docs README.md -L {{.LEVEL | default "syntax"}} -l {{.LANGUAGES}}
    requires:
      vars: [LANGUAGES]

  docs:build:
    desc: Build the documentation site
    cmds:
      - npm --prefix website install
      - npm --prefix website run build

  docs:serve:
    desc: Run the documentation site locally with live reload
    cmds:
      - npm --prefix website install
      - npm --prefix website run dev

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  version:sync:
    desc: "Update all package versions to the given VERSION"
    requires:
      vars: [VERSION]
    cmds:
      # Every published crate must appear in both substitutions and in the
      # second one's alternation. scythe-inspect was missing from all three,
      # so its own version and every pin on it silently kept the old value --
      # and because `publish_crates` tolerates an "already exists" error, the
      # release succeeded green while shipping five crates instead of six.
      # `version:check` below is the guard that makes a recurrence loud.
      - sed -i '' 's/^version = ".*"/version = "{{.VERSION}}"/' crates/scythe-cli/Cargo.toml crates/scythe-core/Cargo.toml crates/scythe-codegen/Cargo.toml crates/scythe-backend/Cargo.toml crates/scythe-lint/Cargo.toml crates/scythe-inspect/Cargo.toml
      # Pins are rewritten across every crate, not an explicit list: cargo
      # rejects a path dependency whose `version` requirement does not match
      # the path crate's actual version, so a crate missing from the list
      # breaks the build outright. That includes crates the first substitution
      # deliberately skips -- an unpublished crate still pins published ones.
      # An explicit list is exactly how scythe-inspect went unbumped for two
      # releases; a glob cannot forget a crate that someone adds later.
      - sed -i '' -E 's/(scythe-(core|codegen|backend|lint|cli|inspect).*version = ")[^"]*"/\1{{.VERSION}}"/' crates/*/Cargo.toml
      # The documented pre-commit `rev:` pins are the one version string a user
      # copies verbatim into their own repo, so a stale one silently pins them to
      # the previous release. They are prose Markdown, not snippets, so no CI job
      # validates them -- they drifted through 0.12.0 unnoticed.
      # `[[:space:]]`, not `\s`: BSD sed -E is POSIX ERE and does not know `\s`,
      # so that spelling matches nothing and reports success -- the same silent
      # no-op that let scythe-inspect go unbumped for two releases.
      # Driven off a grep, not a list, for the same reason as the pin
      # substitution above: an explicit list silently omits whatever nobody
      # remembered to add. It did. `skills/scythe/SKILL.md` sat at v0.6.0 and
      # `skills/scythe/references/cli-reference.md` at v0.5.0 -- eight and nine
      # releases stale -- purely because `skills/` was never in the list, and
      # `version:check` could not catch it because it read the same list.
      - |
        files=$(grep -rlE '^[[:space:]]*rev: v[0-9]+\.[0-9]+\.[0-9]+' \
          README.md website/src skills 2>/dev/null || true)
        if [ -n "$files" ]; then
          echo "$files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            sed -i '' -E 's/^([[:space:]]*rev: )v[0-9]+\.[0-9]+\.[0-9]+/\1v{{.VERSION}}/' "$f"
          done
        fi
      # Every generated-code example in the docs opens with a provenance header,
      # and that header embeds the scythe version. Same blind spot as the `rev:`
      # pins above: prose Markdown that no CI job validates, so a stale one just
      # sits there claiming the release generated output labelled with the
      # previous version. Driven off a grep rather than an explicit file list --
      # examples get added over time, and a list cannot forget a file nobody has
      # written yet. The read loop avoids `xargs -r`, which BSD xargs lacks: a
      # plain `xargs sed` on empty input runs sed with no file arguments, and it
      # then blocks reading stdin.
      #
      # The changelog is excluded, and must stay excluded. Its entries quote the
      # header as it looked in the release being described, so rewriting them
      # would retroactively relabel every historical entry with the version
      # currently being cut -- turning a record of what shipped into a claim
      # that every past release emitted today's version.
      #
      # `skills` is in the search path even though no provenance string lives
      # there today. It is latent, not hypothetical: the `rev:` sync above
      # records that `skills/` was left out of exactly this kind of list once
      # before and went eight and nine releases stale as a result. A grep over a
      # directory that currently matches nothing costs nothing; a directory
      # nobody remembered to add costs a release.
      - |
        files=$(grep -rlE 'scythe:provenance v=[0-9]+\.[0-9]+\.[0-9]+' \
          website/src README.md skills 2>/dev/null \
          | grep -v 'changelog\.md$' || true)
        if [ -n "$files" ]; then
          echo "$files" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            sed -i '' -E 's/(scythe:provenance v=)[0-9]+\.[0-9]+\.[0-9]+/\1{{.VERSION}}/g' "$f"
          done
        fi
      - task: version:check
      # `cargo check --workspace` is not subsumed by the regeneration step
      # below: that step only builds scythe-cli in release mode (via
      # integration_tests/Taskfile.yaml's `build:scythe`), which does not
      # type-check crates that aren't in scythe-cli's dependency graph (e.g.
      # scythe-lint, tools/*). Keep both.
      #
      # No `2>/dev/null || true` here: that used to swallow both the output
      # and the exit code, so a version bump that broke the build (a crate
      # left off the substitution list above, say) would sail through this
      # task, regenerate integration_tests/ from a workspace that does not
      # compile, and report success. Let it fail loudly and stop the task.
      - cargo check --workspace
      # Every generated artifact's first line embeds CARGO_PKG_VERSION (the
      # `v=` field of its `scythe:provenance` header), so the moment the
      # substitutions above land, every committed
      # integration_tests/**/generated/ file is stale: its header still names
      # the old version while a freshly built `scythe` would emit the new
      # one. CI's `generated-freshness` job then fails on the release commit
      # itself. `generate:all` in integration_tests/Taskfile.yaml already
      # rebuilds `scythe` from source via its `build:scythe` dependency and
      # invokes it by absolute path (see that task's comment, issue #85) so a
      # stale `scythe` on $PATH cannot silently revert this step -- reuse it
      # here instead of re-deriving that binary-resolution logic.
      - cd integration_tests && task generate:all
      - echo "All crate versions updated to {{.VERSION}}"

  version:check:
    desc: "Fail if any published crate's version or inter-crate pin has drifted"
    silent: true
    cmds:
      # Portable (no BSD sed) so this can gate CI on Linux, unlike version:sync.
      # Violations are accumulated in a variable rather than setting a flag
      # inside a `... | while read` -- a pipeline runs its loop in a subshell,
      # so the flag is lost and the check reports drift while still exiting 0.
      # Two vacuous-pass guards below (`expected` non-empty, `revs_checked`
      # non-zero). Both loops here accumulate into `violations` and report
      # success when it stays empty -- which is also what happens when a loop
      # runs zero times, or when every comparison is against the empty string.
      # So a file that moves or a pattern that stops recognising its own input
      # would turn this task into an unconditional "All crate versions, pins
      # and documented rev pins agree" with nothing behind it, while ci.yml's
      # Lint job goes on treating it as the release gate. Exactly the failure
      # ci.yml's provenance check documents at its own `count -eq 0` guard.
      #
      # Verified by mutation, both guards: renaming the `version =` key in
      # crates/scythe-cli/Cargo.toml, and renaming every `rev:` key under
      # README.md/website/src/skills. Each exits 1 here; against the same
      # inputs the pre-guard task printed "All crate versions, pins and
      # documented rev pins agree on 0.14.0" and exited 0.
      #
      # `crates_checked` deliberately has no zero-guard: `expected` is read
      # from crates/scythe-cli/Cargo.toml, so the glob below cannot match zero
      # files without the guard above having already fired. A branch that
      # cannot be reached is not a check. It is counted only for the summary
      # line, so the output states how much was actually inspected.
      - |
        expected=$(awk -F'"' '/^version = /{print $2; exit}' crates/scythe-cli/Cargo.toml)
        if [ -z "$expected" ]; then
          echo "version:check: could not read a version from crates/scythe-cli/Cargo.toml -- that file is this task's only source of truth, so every comparison below would be against the empty string" >&2
          exit 1
        fi
        violations=""
        crates_checked=0
        revs_checked=0
        for f in crates/*/Cargo.toml; do
          crates_checked=$((crates_checked + 1))
          # An unpublished crate never reaches crates.io, so its own version is
          # meaningless and version:sync deliberately leaves it alone --
          # scythe-conformance sits at 0.1.0 forever. Asserting lockstep on it
          # would make `task version:sync` abort on its own version:check step,
          # with no spelling of the version that could satisfy both.
          # Its *pins* are checked below regardless: cargo rejects a path
          # dependency whose `version` requirement does not match the path
          # crate's actual version, published or not.
          if ! grep -qE '^publish[[:space:]]*=[[:space:]]*false' "$f"; then
            own=$(awk -F'"' '/^version = /{print $2; exit}' "$f")
            if [ "$own" != "$expected" ]; then
              violations="${violations}version drift: $f declares $own, expected $expected\n"
            fi
          fi
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            if [ "$v" != "$expected" ]; then
              violations="${violations}pin drift: $f pins a scythe crate at $v, expected $expected\n"
            fi
          done <<PINS
        $(grep -oE 'scythe-[a-z]+ = \{[^}]*version = "[^"]*"' "$f" | sed -E 's/.*version = "([^"]*)"/\1/')
        PINS
        done
        # The documented pre-commit `rev:` pins are rewritten by version:sync but
        # validated by no other job, so without this they drift silently -- and a
        # stale one pins every user who copies the snippet to the old release.
        for f in $(grep -rlE '^[[:space:]]*rev: v[0-9]+\.[0-9]+\.[0-9]+' README.md website/src skills 2>/dev/null || true); do
          while IFS= read -r r; do
            [ -z "$r" ] && continue
            revs_checked=$((revs_checked + 1))
            if [ "$r" != "v$expected" ]; then
              violations="${violations}rev drift: $f documents $r, expected v$expected\n"
            fi
          done <<REVS
        $(grep -oE '^[[:space:]]*rev: v[0-9]+\.[0-9]+\.[0-9]+' "$f" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
        REVS
        done
        if [ "$revs_checked" -eq 0 ]; then
          echo "version:check: found no documented 'rev: vX.Y.Z' pin under README.md, website/src or skills. version:sync rewrites those pins and nothing else validates them, so zero matches means this check silently stopped covering them -- either the pins moved (add their location to both this task and version:sync) or the grep pattern no longer recognises them." >&2
          exit 1
        fi
        if [ -n "$violations" ]; then
          printf "%b" "$violations" >&2
          exit 1
        fi
        echo "All $crates_checked crate version(s)/pin(s) and $revs_checked documented rev pin(s) agree on $expected"

  update:
    desc: Update dependencies (workspace + dev tooling + integration tests)
    cmds:
      - cargo upgrade --incompatible
      - cargo update
      - uv lock --upgrade
      - task: update:integration
      # cargo rewrites Cargo.toml with its own 4-space indent, which poly then
      # rejects. Reformat here so a dependency bump cannot leave CI red.
      - poly fmt --fix .

  update:integration:
    desc: Update lock files in all integration test projects
    cmds:
      - for f in integration_tests/*/Cargo.lock; do (cd "${f%/*}" && cargo update); done
      - for f in integration_tests/*/uv.lock; do (cd "${f%/*}" && uv lock --upgrade); done
      - for f in integration_tests/*/pnpm-lock.yaml; do (cd "${f%/*}" && pnpm update --lockfile-only); done
      - for f in integration_tests/*/go.sum; do (cd "${f%/*}" && go get -u ./... && go mod tidy); done
      - for f in integration_tests/*/Gemfile.lock; do (cd "${f%/*}" && bundle lock --update); done
      - for f in integration_tests/*/mix.lock; do (cd "${f%/*}" && mix deps.update --all); done
      - for f in integration_tests/*/composer.lock; do (cd "${f%/*}" && composer update --no-install); done
