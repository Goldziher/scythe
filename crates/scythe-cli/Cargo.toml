[package]
name = "scythe-cli"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "CLI for scythe -- SQL-to-code generator with linting and formatting"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld"]
keywords = ["sql", "codegen", "cli", "database", "sqlc"]
categories = ["command-line-utilities", "database"]

# ~keep cargo-binstall support: goreleaser names assets `scythe-{target}` (ProjectName,
# ~keep not the `scythe-cli` crate name) and ships tar.gz on unix but a .zip on windows,
# ~keep so pin the URL and bin-dir explicitly and let `{ archive-suffix }` pick the right
# ~keep extension per target. Binary sits at the archive root.
# ~keep See https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/scythe-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "scythe"
path = "src/main.rs"

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
regex = "1"
scythe-backend = { path = "../scythe-backend", version = "0.13.0" }
scythe-codegen = { path = "../scythe-codegen", version = "0.13.0" }
scythe-core = { path = "../scythe-core", version = "0.13.0" }
scythe-inspect = { path = "../scythe-inspect", version = "0.13.0" }
scythe-lint = { path = "../scythe-lint", version = "0.13.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlparser = "0.62"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
syn = { version = "3", features = ["full", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
