[package]
name = "scythe-inspect"
version = "0.20.1"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "Live-database health-check engine for scythe"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "postgres", "lint", "audit", "database"]
categories = ["development-tools", "database"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

[features]
default = []
live-tests = []

[dependencies]
async-trait = "0.1"
# ~keep Exact, not caret. DuckDB 1.2's static extension autoregister archive broke the
# ~keep cross-compiler the pre-0.20.1 release pipeline used, and the binary-size ratchet
# ~keep has not been re-measured against it; a caret requirement would let a `cargo
# ~keep update` take it silently at the moment the release starts building natively.
# ~keep Lift this pin together with a fresh size baseline.
duckdb = { version = "=1.10506.1", features = ["bundled"] }
mysql_async = "0.37"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
scythe-core = { path = "../scythe-core", version = "0.20.1" }
scythe-lint = { path = "../scythe-lint", version = "0.20.1" }
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = "0.7"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
