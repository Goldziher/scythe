[package]
name = "scythe-lint"
version = "0.20.3"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "SQL linting and audit engine for scythe -- 23 lint rules, 35 audit rules, sqruff integration"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "linter", "lint", "formatting", "sqruff"]
categories = ["development-tools"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
scythe-core = { path = "../scythe-core", version = "0.20.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.63", features = ["visitor"] }
sqruff-lib = "0.44"
thiserror = "2"
toml = "1.1"
