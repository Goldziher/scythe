[package]
name = "scythe-lint"
version = "0.16.0"
edition = "2024"
license = "MIT"
description = "SQL linting and audit engine for scythe -- 23 lint rules, 35 audit rules, sqruff integration"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld"]
keywords = ["sql", "linter", "lint", "formatting", "sqruff"]
categories = ["development-tools"]

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
scythe-core = { path = "../scythe-core", version = "0.16.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.62", features = ["visitor"] }
sqruff-lib = "0.40"
thiserror = "2"
toml = "1.1"
