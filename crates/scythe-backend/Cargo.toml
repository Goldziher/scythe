[package]
name = "scythe-backend"
version = "0.20.3"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "Backend manifest, type resolution, and template rendering for scythe"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "codegen", "backend", "type-mapping", "manifest"]
categories = ["development-tools"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
]

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
