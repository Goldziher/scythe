[package]
name = "scythe-codegen"
version = "0.20.2"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
description = "Polyglot code generation backends for scythe"
repository = "https://github.com/Goldziher/scythe"
homepage = "https://goldziher.github.io/scythe"
documentation = "https://goldziher.github.io/scythe"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
keywords = ["sql", "codegen", "polyglot", "code-generation", "database"]
categories = ["development-tools", "database"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/src/**",
    "/manifests/**",
    "/generated-code-poly.toml",
    "/tests/java_stubs/**",
    "/tests/js_mode_stubs/**",
    "/tests/elixir_stubs/**",
    "!/src/backends/sql_text_characterization_tests.rs",
]

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
scythe-backend = { path = "../scythe-backend", version = "0.20.2" }
scythe-core = { path = "../scythe-core", version = "0.20.2" }
toml = "1.1"

[dev-dependencies]
criterion = "0.8"
scythe-lint = { path = "../scythe-lint", version = "0.20.2" }
syn = { version = "3", features = ["full", "parsing"] }

[[bench]]
name = "analyze_codegen"
harness = false
