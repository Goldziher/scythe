[backend]
name = "java-jdbc"
language = "java"
file_extension = "java"
engine = "snowflake"
description = "Java code generation targeting JDBC with Snowflake"

[types.scalars]
bool = "boolean"
int16 = "short"
int32 = "int"
int64 = "long"
float32 = "float"
float64 = "double"
string = "String"
bytes = "byte[]"
uuid = "String"
decimal = "java.math.BigDecimal"
date = "java.time.LocalDate"
time = "java.time.LocalTime"
time_tz = "java.time.OffsetTime"
datetime = "java.time.LocalDateTime"
datetime_tz = "java.time.OffsetDateTime"
interval = "String"
json = "String"
inet = "String"

[types.containers]
# Arrays have no typed reader on the JVM backends. Every non-scalar column is read through
# the untyped object accessor, whose static type is Object on Java and Any on Kotlin, so a
# list-typed declaration never compiles. Arrays are declared in their text form instead,
# exactly like the range container below.
array = "String"
nullable = "@Nullable {T}"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "camelCase"
enum_variant_case = "SCREAMING_SNAKE_CASE"
row_suffix = "Row"
reserved = [
  "abstract",
  "assert",
  "boolean",
  "break",
  "byte",
  "case",
  "catch",
  "char",
  "class",
  "const",
  "continue",
  "default",
  "do",
  "double",
  "else",
  "enum",
  "extends",
  "final",
  "finally",
  "float",
  "for",
  "goto",
  "if",
  "implements",
  "import",
  "instanceof",
  "int",
  "interface",
  "long",
  "native",
  "new",
  "package",
  "private",
  "protected",
  "public",
  "return",
  "short",
  "static",
  "strictfp",
  "super",
  "switch",
  "synchronized",
  "this",
  "throw",
  "throws",
  "transient",
  "try",
  "void",
  "volatile",
  "while",
  "var",
  "yield",
  "record",
  "sealed",
  "permits",
  "true",
  "false",
  "null",
]

[imports.rules]
