[backend]
name = "ruby-trilogy"
language = "ruby"
file_extension = "rb"
engine = "mysql"
description = "Ruby code generation targeting trilogy gem"

[types.scalars]
bool = "Boolean"
int16 = "Integer"
int32 = "Integer"
int64 = "Integer"
float32 = "Float"
float64 = "Float"
string = "String"
bytes = "String"
uuid = "String"
decimal = "BigDecimal"
date = "Date"
time = "Time"
time_tz = "Time"
datetime = "Time"
datetime_tz = "Time"
interval = "String"
json = "Hash"
inet = "String"

[types.containers]
array = "Array<{T}>"
nullable = "{T}"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "snake_case"
enum_variant_case = "SCREAMING_SNAKE_CASE"
row_suffix = "Row"
sanitize_field_names = true
reserved = [
  "begin",
  "break",
  "case",
  "class",
  "def",
  "defined?",
  "do",
  "else",
  "elsif",
  "end",
  "ensure",
  "false",
  "for",
  "if",
  "in",
  "module",
  "next",
  "nil",
  "not",
  "or",
  "redo",
  "rescue",
  "retry",
  "return",
  "self",
  "super",
  "then",
  "true",
  "undef",
  "unless",
  "until",
  "when",
  "while",
  "yield",
]

[imports.rules]
