[backend]
name = "go-pgx"
language = "go"
file_extension = "go"
engine = "postgresql"
description = "Go code generation targeting pgx v5"

[types.scalars]
bool = "bool"
int16 = "int16"
int32 = "int32"
int64 = "int64"
float32 = "float32"
float64 = "float64"
string = "string"
bytes = "[]byte"
uuid = "uuid.UUID"
decimal = "decimal.Decimal"
date = "time.Time"
time = "time.Time"
time_tz = "time.Time"
datetime = "time.Time"
datetime_tz = "time.Time"
interval = "time.Duration"
json = "json.RawMessage"
inet = "netip.Addr"

[types.containers]
array = "[]{T}"
nullable = "*{T}"
range = "string"
json_typed = "{T}"
json_nested = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "PascalCase"
enum_variant_case = "PascalCase"
row_suffix = "Row"
sanitize_field_names = true
reserved = [
  "break",
  "case",
  "chan",
  "const",
  "continue",
  "default",
  "defer",
  "else",
  "fallthrough",
  "for",
  "func",
  "go",
  "goto",
  "if",
  "import",
  "interface",
  "map",
  "package",
  "range",
  "return",
  "select",
  "struct",
  "switch",
  "type",
  "var",
]

[imports.rules]
"time." = "\"time\""
"decimal." = "\"github.com/shopspring/decimal\""
"uuid." = "\"github.com/google/uuid\""
"json." = "\"encoding/json\""
"netip." = "\"net/netip\""
