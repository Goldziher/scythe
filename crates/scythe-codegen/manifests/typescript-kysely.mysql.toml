[backend]
name = "typescript-kysely"
language = "typescript"
file_extension = "ts"
engine = "mysql"
description = "TypeScript code generation targeting Kysely's sql tag against any Kysely dialect (MySQL/MariaDB)"

[types.scalars]
bool = "number"
int16 = "number"
int32 = "number"
int64 = "number"
float32 = "number"
float64 = "number"
string = "string"
bytes = "Buffer"
uuid = "string"
decimal = "string"
date = "string"
time = "string"
time_tz = "string"
datetime = "Date"
datetime_tz = "Date"
interval = "string"
json = "Record<string, unknown>"
inet = "string"

[types.containers]
array = "{T}[]"
nullable = "{T} | null"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "camelCase"
enum_variant_case = "PascalCase"
row_suffix = "Row"
# Reserved only in a binding position (a parameter name, a `const`, a
# destructuring target). All of these are legal as property keys, which is
# why they are not in `reserved`: mangling the column would break the cast
# of the driver's rows onto the generated row type. Strict-mode words are
# included because generated modules are ESM, which is always strict, and
# `arguments`/`eval` because binding either is a SyntaxError there.
reserved_bindings = [
  "arguments",
  "await",
  "break",
  "case",
  "catch",
  "class",
  "const",
  "continue",
  "debugger",
  "default",
  "delete",
  "do",
  "else",
  "enum",
  "eval",
  "export",
  "extends",
  "false",
  "finally",
  "for",
  "function",
  "if",
  "implements",
  "import",
  "in",
  "instanceof",
  "interface",
  "let",
  "new",
  "null",
  "package",
  "private",
  "protected",
  "public",
  "return",
  "static",
  "super",
  "switch",
  "this",
  "throw",
  "true",
  "try",
  "typeof",
  "var",
  "void",
  "while",
  "with",
  "yield",
]

[imports.rules]
