[backend]
name = "typescript-duckdb"
language = "typescript"
file_extension = "ts"
engine = "duckdb"
description = "TypeScript code generation targeting @duckdb/node-api"

[types.scalars]
bool = "boolean"
int16 = "number"
int32 = "number"
int64 = "bigint"
float32 = "number"
float64 = "number"
string = "string"
# @duckdb/node-api hands a BLOB column back as a `DuckDBBlobValue` wrapper
# object, not a raw `Uint8Array` -- the driver's own `DuckDBValue` union
# (see typescript_duckdb.rs's `write_bind_and_run`) covers
# null/boolean/number/bigint/string plus its wrapper classes, but not
# `Uint8Array`, which is why binding one needs the `as DuckDBValue[]` force
# cast. Declaring `bytes` as `Uint8Array` here would type a read column as
# something the driver never actually returns.
#
# Verified against the real package rather than inferred: `npm pack
# @duckdb/node-api@1.5.5-r.4` ships `lib/values/DuckDBBlobValue.d.ts` declaring
# `class DuckDBBlobValue { readonly bytes: Uint8Array }`, and `DuckDBValue`
# lists it in its union. It re-exports from the package root through
# index -> duckdb -> values, so the generated `import type` resolves. The
# driver also ships `blobValue(input: Uint8Array | string)`, which is what a
# caller should use to construct one for a bind parameter -- this manifest has
# no read/bind split, so the bind-position type changed with the read type.
bytes = "DuckDBBlobValue"
uuid = "string"
decimal = "number"
date = "string"
time = "string"
time_tz = "string"
datetime = "string"
datetime_tz = "string"
interval = "string"
json = "Record<string, unknown>"
inet = "string"

[types.containers]
array = "{T}[]"
nullable = "{T} | null"
range = "string"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "camelCase"
enum_variant_case = "PascalCase"
row_suffix = "Row"
# Reserved only in a binding position (a parameter name, a `const`, a
# destructuring target). All of these are legal as property keys, which is
# why they are not in `reserved`: mangling the column would break the cast
# of the driver's rows onto the generated row type. Strict-mode words are
# included because generated modules are ESM, which is always strict, and
# `arguments`/`eval` because binding either is a SyntaxError there.
reserved_bindings = [
  "arguments",
  "await",
  "break",
  "case",
  "catch",
  "class",
  "const",
  "continue",
  "debugger",
  "default",
  "delete",
  "do",
  "else",
  "enum",
  "eval",
  "export",
  "extends",
  "false",
  "finally",
  "for",
  "function",
  "if",
  "implements",
  "import",
  "in",
  "instanceof",
  "interface",
  "let",
  "new",
  "null",
  "package",
  "private",
  "protected",
  "public",
  "return",
  "static",
  "super",
  "switch",
  "this",
  "throw",
  "true",
  "try",
  "typeof",
  "var",
  "void",
  "while",
  "with",
  "yield",
]

[imports.rules]
