[backend]
name = "rust-sibyl"
language = "rust"
file_extension = "rs"
engine = "oracle"
description = "Rust code generation targeting sibyl (Oracle OCI)"

[types.scalars]
bool = "bool"
int16 = "i16"
int32 = "i32"
int64 = "i64"
float32 = "f32"
float64 = "f64"
string = "String"
bytes = "Vec<u8>"
uuid = "String"
decimal = "f64"
date = "chrono::NaiveDateTime"
time = "chrono::NaiveTime"
time_tz = "chrono::NaiveTime"
datetime = "chrono::NaiveDateTime"
datetime_tz = "chrono::DateTime<chrono::FixedOffset>"
interval = "String"
json = "String"
inet = "String"

[types.containers]
array = "Vec<{T}>"
nullable = "Option<{T}>"
range = "String"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "snake_case"
enum_variant_case = "PascalCase"
row_suffix = "Row"
sanitize_field_names = true
reserved = [
  "as",
  "async",
  "await",
  "break",
  "const",
  "continue",
  "crate",
  "dyn",
  "else",
  "enum",
  "extern",
  "false",
  "fn",
  "for",
  "if",
  "impl",
  "in",
  "let",
  "loop",
  "match",
  "mod",
  "move",
  "mut",
  "pub",
  "ref",
  "return",
  "self",
  "static",
  "struct",
  "super",
  "trait",
  "true",
  "type",
  "unsafe",
  "use",
  "where",
  "while",
  "abstract",
  "become",
  "box",
  "do",
  "final",
  "macro",
  "override",
  "priv",
  "try",
  "typeof",
  "unsized",
  "virtual",
  "yield",
]

[imports.rules]
"chrono::" = "use chrono;"
"rust_decimal::" = "use rust_decimal::Decimal;"
