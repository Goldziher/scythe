[backend]
name = "kotlin-jdbc"
language = "kotlin"
file_extension = "kt"
engine = "mysql"
description = "Kotlin code generation targeting JDBC with MySQL"

[types.scalars]
bool = "Boolean"
int16 = "Short"
int32 = "Int"
int64 = "Long"
float32 = "Float"
float64 = "Double"
string = "String"
bytes = "ByteArray"
uuid = "String"
decimal = "java.math.BigDecimal"
date = "java.time.LocalDate"
time = "java.time.LocalTime"
time_tz = "java.time.LocalTime"
datetime = "java.time.LocalDateTime"
datetime_tz = "java.time.LocalDateTime"
interval = "String"
json = "String"
inet = "String"

[types.containers]
array = "List<{T}>"
nullable = "{T}?"
json_typed = "{T}"

[naming]
struct_case = "PascalCase"
fn_case = "camelCase"
enum_variant_case = "SCREAMING_SNAKE_CASE"
row_suffix = "Row"
reserved = ["as", "break", "class", "continue", "do", "else", "false", "for", "fun", "if", "in", "interface", "is", "null", "object", "package", "return", "super", "this", "throw", "true", "try", "typealias", "typeof", "val", "var", "when", "while"]

[imports.rules]
