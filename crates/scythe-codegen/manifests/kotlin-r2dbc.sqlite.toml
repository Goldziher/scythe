[backend]
name = "kotlin-r2dbc"
language = "kotlin"
file_extension = "kt"
engine = "sqlite"
description = "Kotlin code generation targeting R2DBC with SQLite (coroutines)"

[types.scalars]
bool = "Boolean"
int16 = "Short"
int32 = "Int"
int64 = "Long"
float32 = "Float"
float64 = "Double"
string = "String"
bytes = "ByteArray"
uuid = "String"
decimal = "Double"
date = "String"
time = "String"
time_tz = "String"
datetime = "String"
datetime_tz = "String"
interval = "String"
json = "String"
inet = "String"

[types.containers]
# Arrays have no typed reader on the JVM backends. Every non-scalar column is read through
# the untyped object accessor, whose static type is Object on Java and Any on Kotlin, so a
# list-typed declaration never compiles. Arrays are declared in their text form instead,
# exactly like the range container below.
array = "String"
nullable = "{T}?"
json_typed = "{T}"
range = "String"

[naming]
struct_case = "PascalCase"
fn_case = "camelCase"
enum_variant_case = "SCREAMING_SNAKE_CASE"
row_suffix = "Row"
sanitize_field_names = true
reserved = [
  "as",
  "break",
  "class",
  "continue",
  "do",
  "else",
  "false",
  "for",
  "fun",
  "if",
  "in",
  "interface",
  "is",
  "null",
  "object",
  "package",
  "return",
  "super",
  "this",
  "throw",
  "true",
  "try",
  "typealias",
  "typeof",
  "val",
  "var",
  "when",
  "while",
]

[imports.rules]
