[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'scythe-hermes-plugin'
version = '0.20.2'
description = 'Generate typed database access code from SQL, configure drivers, lint and format queries. Skills only; install the Scythe CLI separately.'
license = 'MIT'
requires-python = '>=3.11'
keywords = ['sql', 'code-generation', 'database', 'linting']

[project.readme]
content-type = 'text/markdown'
text = "# scythe Hermes plugin\n\nGenerate typed database access code from SQL, configure drivers, lint and format queries. Skills only; install the Scythe CLI separately.\n\nInstall this package in the same Python environment as Hermes Agent:\n\n```sh\npython -m pip install scythe-hermes-plugin\n```\n\nEnable the plugin through Hermes Agent's plugin configuration. Available registrations depend on the plugin's authored Hermes adapter.\n"

[project.entry-points]
[project.entry-points.'hermes_agent.plugins']
scythe = 'scythe_hermes_plugin'

[project.urls]
Repository = 'https://github.com/Goldziher/scythe'

[tool]
[tool.hatch]
[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = ['src/scythe_hermes_plugin']
