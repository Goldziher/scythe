
version = "5.0"
default_layers = ["plugins"]
name = 'scythe'
description = 'SQL compilation and code generation framework — compiles annotated SQL into type-safe database access code for 10 languages'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = [
  '!git-workflow',
  'rust',
  'python',
  'typescript',
  'ruby',
  'php',
  'elixir',
  'go',
  'java',
  'csharp',
  'pyo3',
  'napi-rs',
  'default-commands',
]

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "adb0caa92c4d8155fb1680618f72a321a832660b"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "adb0caa92c4d8155fb1680618f72a321a832660b"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "adb0caa92c4d8155fb1680618f72a321a832660b"
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.3.0", "mcp"]

[lock]
include_outputs = false
