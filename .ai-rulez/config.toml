
version = "5.0"
name = 'scythe'
description = 'SQL compilation and code generation framework — compiles annotated SQL into type-safe database access code for 10 languages'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = [
  'rust',
  'python',
  'typescript',
  'ruby',
  'php',
  'elixir',
  'go',
  'java',
  'csharp',
  'pyo3',
  'napi-rs',
  'default-commands',
]

[header]
text = """Generated file — DO NOT EDIT.
Project: scythe
Source: .ai-rulez/config.toml
Modify .ai-rulez/ content and regenerate with ai-rulez generate.
MCP server: pnpm dlx ai-rulez@5.0.1 mcp
"""
style = 'minimal'
hashes = "full"

[[includes]]
name = 'kreuzberg-core'
source = 'https://github.com/kreuzberg-dev/ai-rulez.git'
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'kreuzberg-cicd'
source = 'https://github.com/kreuzberg-dev/ai-rulez.git'
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'kreuzberg-e2e-generator'
source = 'https://github.com/kreuzberg-dev/ai-rulez.git'
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
