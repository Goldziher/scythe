
version = "5.0"
default_layers = ["plugins"]
name = 'scythe'
description = 'SQL compilation and code generation framework — compiles annotated SQL into type-safe database access code for 10 languages'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = [
  '!ai-governance/agent-workflow',
  '!git-workflow',
  '!testing/test-alongside-code',
  '!testing/tdd-workflow',
  'rust',
  'python',
  'typescript',
  'ruby',
  'php',
  'elixir',
  'go',
  'java',
  'csharp',
  'pyo3',
  'napi-rs',
  'default-commands',
]

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/cicd'
merge_strategy = 'local-override'

[mcp]
self_server_command = ["npx", "-y", "ai-rulez@latest", "mcp"]

[lock]
include_outputs = false

# Goldziher/ai-rulez#485: ai-rulez reports the exported public skill copy as a duplicate of its source. ~keep
[[lint.ignore_rules]]
rules = ["AR701"]
paths = ["skills/*/SKILL.md"]
