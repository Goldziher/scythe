name: Integration Tests

# The path filter is the list of things that can change generated output. It
# was previously narrower than that list, and the gap was not academic:
#
#   - crates/scythe-backend/** *is* the renderer (renderer.rs, manifest.rs,
#     naming.rs, types.rs). A naming-convention change there rewrites every
#     backend's output for every language and triggered nothing at all.
#   - tools/integration-test-generator/** owns the *.jinja harness templates.
#     A formatter mangled them once already -- see the comment at ci.yml:167.
#   - This file was absent from its own filter, so a change that broke the
#     workflow could not run the workflow that would have reported it.
on:
  push:
    branches: [main]
    paths:
      - "crates/scythe-codegen/**"
      - "crates/scythe-core/**"
      - "crates/scythe-backend/**"
      - "crates/scythe-cli/**"
      - "integration_tests/**"
      - "tools/integration-test-generator/**"
      - "testing_data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/scythe-codegen/**"
      - "crates/scythe-core/**"
      - "crates/scythe-backend/**"
      - "crates/scythe-cli/**"
      - "integration_tests/**"
      - "tools/integration-test-generator/**"
      - "testing_data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-pg:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scythe
          POSTGRES_PASSWORD: scythe
          POSTGRES_DB: scythe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://scythe:scythe@localhost:5432/scythe_test

    steps:
      - uses: actions/checkout@v6

      - name: Run PG schema migration
        run: PGPASSWORD=scythe psql -h localhost -U scythe -d scythe_test -f integration_tests/sql/pg/schema.sql

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            integration_tests/rust-sqlx -> target
            integration_tests/rust-sqlx-nested-json -> target
            integration_tests/rust-tokio-postgres -> target
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Ruby 3.3 ships Bundler 2.5.x, but the committed Gemfile.lock files
          # are written by Bundler 4. An older Bundler cannot read a newer
          # lockfile: it re-execs to install the newer one mid-step and then
          # fails to resolve gems. A newer Bundler reads older lockfiles fine.
          bundler: latest
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql

      - run: pip install uv
      - run: npm install -g pnpm

      - name: Test rust-sqlx
        working-directory: integration_tests/rust-sqlx
        run: cargo run --quiet

      - name: Test rust-sqlx-nested-json
        working-directory: integration_tests/rust-sqlx-nested-json
        run: cargo run --quiet

      - name: Test rust-tokio-postgres
        working-directory: integration_tests/rust-tokio-postgres
        run: cargo run --quiet

      - name: Test python-psycopg3
        working-directory: integration_tests/python-psycopg3
        run: uv run python test_integration.py

      - name: Test python-asyncpg
        working-directory: integration_tests/python-asyncpg
        run: uv run python test_integration.py

      - name: Test python-psycopg3-pydantic
        working-directory: integration_tests/python-psycopg3-pydantic
        run: uv run python test_integration.py

      - name: Test python-psycopg3-msgspec
        working-directory: integration_tests/python-psycopg3-msgspec
        run: uv run python test_integration.py

      - name: Test go-pgx
        working-directory: integration_tests/go-pgx
        run: go mod tidy && go run .

      - name: Test typescript-postgres
        working-directory: integration_tests/typescript-postgres
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test typescript-pg
        working-directory: integration_tests/typescript-pg
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test typescript-pg-zod
        working-directory: integration_tests/typescript-pg-zod
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test typescript-pg-outer-join-unions
        working-directory: integration_tests/typescript-pg-outer-join-unions
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test typescript-pg-zod-outer-join-unions
        working-directory: integration_tests/typescript-pg-zod-outer-join-unions
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      # structs_only has no runtime surface, so the gate is that the emitted
      # file type-checks and contains neither the driver import nor a query
      # function.
      - name: Test typescript-pg-structs-only
        working-directory: integration_tests/typescript-pg-structs-only
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts
          if grep -q 'from "pg"' generated/queries.ts; then
            echo "FAIL: structs_only output must not import the pg driver" >&2
            exit 1
          fi
          if grep -qE '^export async function ' generated/queries.ts; then
            echo "FAIL: structs_only output must not emit query functions" >&2
            exit 1
          fi

      - name: Test typescript-kysely
        working-directory: integration_tests/typescript-kysely
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test java-jdbc
        working-directory: integration_tests/java-jdbc
        run: mvn -q compile exec:java

      - name: Test kotlin-jdbc
        working-directory: integration_tests/kotlin-jdbc
        run: gradle run --quiet

      - name: Test csharp-npgsql
        working-directory: integration_tests/csharp-npgsql
        run: dotnet run

      - name: Test elixir-postgrex
        working-directory: integration_tests/elixir-postgrex
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix run test/integration_test.exs

      - name: Test elixir-ecto
        working-directory: integration_tests/elixir-ecto
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix run test/integration_test.exs

      - name: Test ruby-pg
        working-directory: integration_tests/ruby-pg
        run: |
          bundle install
          bundle exec ruby test_integration.rb

      - name: Test php-pdo
        working-directory: integration_tests/php-pdo
        run: php test_integration.php

      - name: Test php-amphp
        working-directory: integration_tests/php-amphp
        run: |
          composer install --quiet
          php test_integration.php

