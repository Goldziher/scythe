  integration-snowflake:
    name: Snowflake Integration Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: integration_tests/go-gosnowflake/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: pip install uv
      - run: npm install -g pnpm@10

      - name: Test python-snowflake
        working-directory: integration_tests/python-snowflake
        env:
          SNOWFLAKE_USE_FAKESNOW: "1"
        run: uv run python test_integration.py

      # python-snowflake talks to fakesnow in-process. Every other driver
      # below speaks the real Snowflake REST API over HTTP, so they share one
      # fakesnow server (integration_tests/fakesnow/fakesnow_server.py) that
      # translates fakesnow's native Arrow responses into the plain JSON wire
      # format non-Python Snowflake drivers expect.
      - name: Start shared fakesnow server
        working-directory: integration_tests/fakesnow
        run: |
          uv run fakesnow_server.py &
          echo $! > /tmp/fakesnow.pid
          curl --retry 30 --retry-all-errors --retry-delay 1 --silent --output /dev/null http://127.0.0.1:64616/

      - name: Test typescript-snowflake
        working-directory: integration_tests/typescript-snowflake
        env:
          SNOWFLAKE_URL: snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec tsx test.ts

      - name: Test go-gosnowflake
        working-directory: integration_tests/go-gosnowflake
        env:
          SNOWFLAKE_URL: fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http&insecureMode=true
        # `go mod tidy` first, as every other Go step does. The generated go.mod
        # carries direct dependencies only, and Go 1.17+ module-graph pruning
        # needs the indirect set resolved before a build; without this, gosnowflake
        # fails with missing go.sum entries across its Azure/AWS/Arrow tree.
        run: go mod tidy && go run .

      # Both JDBC suites need fakesnow's native Arrow result format, which it
      # now serves to snowflake-jdbc only (dispatched per session on the login
      # request's CLIENT_APP_ID) — the Node, Go and .NET drivers keep the JSON
      # path. snowflake-jdbc also cannot read a temporal column via
      # getObject(col, LocalDateTime.class), so generated code uses the legacy
      # java.sql getters for this engine.
      - name: Test java-jdbc-snowflake
        working-directory: integration_tests/java-jdbc-snowflake
        env:
          SNOWFLAKE_URL: snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http
        run: mvn -q compile exec:java

      - name: Test kotlin-jdbc-snowflake
        working-directory: integration_tests/kotlin-jdbc-snowflake
        env:
          SNOWFLAKE_URL: snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http
        run: gradle run --quiet

      # csharp-snowflake was excluded until 0.14.0 on the belief that fakesnow's
      # binding-name heuristic was at fault for reading p1/p2/p3 as named rather
      # than positional bindings. That diagnosis was wrong: Snowflake's REST
      # protocol keys positional `?` bindings by bare ordinal, so fakesnow was
      # right to reject `p1` and the generated code had been wrong since v0.6.0 --
      # against real Snowflake too, not just the emulator. It was never caught
      # because this backend had never run anywhere. Now it does.
      - name: Test csharp-snowflake
        working-directory: integration_tests/csharp-snowflake
        env:
          SNOWFLAKE_URL: snowflake://fake:snow@127.0.0.1:64616/testdb/public?account=fakesnow&protocol=http
        run: dotnet run

      - name: Stop shared fakesnow server
        if: always()
        run: kill "$(cat /tmp/fakesnow.pid)" 2>/dev/null || true
