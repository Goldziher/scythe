name: Publish

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: true
        type: string

concurrency:
  # ~keep Key on the resolved tag, not github.ref. A tag push and a workflow_dispatch
  # re-run for the SAME tag carry different refs and would otherwise race, while
  # two unrelated dispatches both sit on refs/heads/main and would cancel each
  # other.
  #
  # Never cancel mid-flight: publish_crates pushes six crates in dependency order
  # with sleeps between them, and a crates.io publish cannot be undone -- only
  # yanked. Cancelling partway leaves a release where, say, scythe-cli is on
  # crates.io depending on a scythe-inspect version that never got published.
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Version: $version"

      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      # Runs before anything irreversible. `publish_crates` treats crates.io's
      # "already exists" as success, so a crate left at the previous version
      # publishes nothing and still reports green -- which is exactly how v0.10.0
      # and v0.11.0 shipped five crates instead of six, with scythe-cli depending
      # on a scythe-inspect that was never published. version:check exists to
      # catch that, and until now nothing in CI ran it.
      - name: Verify crate versions agree with each other and with the tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          declared="$(awk -F'"' '/^version = /{print $2; exit}' crates/scythe-cli/Cargo.toml)"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag is v$version but crates/scythe-cli/Cargo.toml declares $declared."
            echo "::error::Run 'task version:sync VERSION=$version' and commit before tagging."
            exit 1
          fi

          task version:check

      - name: Detect already-published versions
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"

          crates_exists=false
          # crates.io's data-access policy rejects the default curl User-Agent
          # with 403, which -f turns into a non-zero exit indistinguishable from
          # "not published". Without an explicit UA this is always false, so
          # publish_crates re-runs its full 30s-sleep chain on every re-run.
          if curl -fsS -A "scythe-release-workflow (https://github.com/Goldziher/scythe)" \
            "https://crates.io/api/v1/crates/scythe-cli/${version}" >/dev/null; then
            crates_exists=true
          fi

          echo "crates_exists=$crates_exists" >> "$GITHUB_OUTPUT"
          echo "crates.io published: $crates_exists"

          npm_exists=false
          if npm view "scythe-cli@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          echo "npm_exists=$npm_exists" >> "$GITHUB_OUTPUT"
          echo "npm published: $npm_exists"

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/scythe-sql/${version}/json" >/dev/null; then
            pypi_exists=true
          fi

          echo "pypi_exists=$pypi_exists" >> "$GITHUB_OUTPUT"
          echo "PyPI published: $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          release_assets_exist=false

          # Require the COMPLETE set, not merely a non-zero count. goreleaser
          # publishes the release live rather than as a draft, so a run that dies
          # partway through uploading leaves a public release carrying some of the
          # archives. A count-based check would then read that as "done" on every
          # re-run, skip release_assets forever, and wedge the release with no
          # automated way back -- while the npm and PyPI wrappers 404 for exactly
          # the platforms whose archives are missing.
          required=(
            "scythe-x86_64-unknown-linux-gnu.tar.gz"
            "scythe-aarch64-unknown-linux-gnu.tar.gz"
            "scythe-x86_64-apple-darwin.tar.gz"
            "scythe-aarch64-apple-darwin.tar.gz"
            "scythe-x86_64-pc-windows-gnu.zip"
            "scythe_${version}_checksums.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            present="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            missing=()
            for asset in "${required[@]}"; do
              grep -qxF "$asset" <<<"$present" || missing+=("$asset")
            done

            if [ ${#missing[@]} -eq 0 ]; then
              release_assets_exist=true
            else
              echo "::warning::release $tag exists but is missing ${#missing[@]} asset(s); re-running release_assets"
              printf '  missing: %s\n' "${missing[@]}"
            fi
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets complete: $release_assets_exist"

  release_assets:
    name: Publish GitHub release assets
    needs: meta
    if: needs.meta.outputs.release_assets_exist != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu

      - name: Install Zig
        run: brew install zig mingw-w64

      - name: Build and publish GitHub release assets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}

  publish_crates:
    name: Publish crates.io
    needs: meta
    if: needs.meta.outputs.crates_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates_auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail

          publish_crate() {
            local crate="$1"
            echo "Publishing $crate..."
            if cargo publish -p "$crate" --allow-dirty 2>cargo-publish.err; then
              echo "$crate published successfully"
              return 0
            fi

            if grep -Eq "crate .* already exists" cargo-publish.err; then
              echo "$crate already published; skipping"
              return 0
            fi

            cat cargo-publish.err >&2
            return 1
          }

          publish_crate scythe-backend
          sleep 30

          publish_crate scythe-core
          sleep 30

          publish_crate scythe-codegen
          sleep 30

          publish_crate scythe-lint
          sleep 30

          publish_crate scythe-inspect
          sleep 30

          publish_crate scythe-cli

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [meta, release_assets]
    # `release_assets` is *skipped* (not "success") when assets already exist, which is the
    # normal idempotent re-run case -- this job must still run then, so gate on it not having
    # failed rather than on a plain `needs:` (which would skip verification on every re-run).
    if: >-
      always() && needs.meta.result == 'success'
      && needs.release_assets.result != 'failure'
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: scythe-cli
      binary-name: scythe
      manifest-path: crates/scythe-cli
      checkout-ref: ${{ needs.meta.outputs.tag }}
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-gnu"}
        ]
      smoke-command: |
        scythe --version

  smoke_wrappers:
    name: Smoke test npm/PyPI wrappers
    needs: [meta, release_assets]
    # ~keep Must run *before* publishing: a smoke test that runs after publish tells you about a
    # package you can no longer unpublish. Gate on release_assets not having failed (same
    # idempotent-rerun reasoning as verify-binstall above), not on a plain `needs:`.
    #
    # Run when *either* registry still needs publishing, not just npm. Both publish jobs
    # require this job to have succeeded, so gating it on npm alone would deadlock the
    # partial-failure case: npm published, PyPI not, re-run -> this job skips -> a skipped
    # result is not 'success' -> publish_pypi can never run.
    if: >-
      always() && needs.meta.result == 'success'
      && needs.release_assets.result != 'failure'
      && (needs.meta.outputs.npm_exists != 'true' || needs.meta.outputs.pypi_exists != 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build and install npm wrapper
        working-directory: release/npm
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack
          tarball="$(ls ./*.tgz)"
          npm install -g "$tarball"
          npm root -g >npm-global-root.txt

      - name: Verify the npm shim reports the exact tag version and forwards the exit code
        # Invokes the committed bin/scythe shim, not the downloaded binary directly, so this
        # also proves argument and exit-code forwarding. Retries absorb CDN propagation delay
        # for release assets that were just published by the `release_assets` job.
        run: |
          set -euo pipefail
          global_root="$(cat release/npm/npm-global-root.txt)"
          shim="$global_root/scythe-cli/bin/scythe"

          for attempt in $(seq 1 10); do
            if output="$(node "$shim" --version 2>&1)"; then
              echo "$output"
              if [[ "$output" == *"$VERSION"* ]]; then
                echo "npm wrapper OK: $output"
                break
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "npm wrapper never reported version $VERSION (last output: ${output:-<none>})" >&2
              exit 1
            fi
            echo "retrying (attempt $attempt)..."
            sleep 10
          done

          if node "$shim" this-is-not-a-real-subcommand >/dev/null 2>&1; then
            echo "expected non-zero exit code from an invalid subcommand" >&2
            exit 1
          fi

      - name: Build and install PyPI wrapper
        working-directory: release/pypi
        run: |
          set -euo pipefail
          uv run python scripts/set_version.py "$VERSION"
          uv build --wheel
          wheel="$(ls dist/*.whl)"

          uv venv .smoke-venv
          if [ -x .smoke-venv/bin/python ]; then
            pybin=.smoke-venv/bin/python
            scythe_bin=.smoke-venv/bin/scythe
          else
            pybin=.smoke-venv/Scripts/python.exe
            scythe_bin=.smoke-venv/Scripts/scythe.exe
          fi

          uv pip install --python "$pybin" "$wheel"
          echo "scythe_bin=$PWD/$scythe_bin" >> "$GITHUB_ENV"

      - name: Verify the PyPI console script reports the exact tag version and forwards the exit code
        # Invokes the installed `scythe` console script (scythe_sql.cli:main), which
        # downloads-then-execs the real binary on first run -- same argument/exit-code
        # forwarding guarantee as the npm shim. Retries absorb CDN propagation delay.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if output="$("$scythe_bin" --version 2>&1)"; then
              echo "$output"
              if [[ "$output" == *"$VERSION"* ]]; then
                echo "PyPI wrapper OK: $output"
                break
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "PyPI wrapper never reported version $VERSION (last output: ${output:-<none>})" >&2
              exit 1
            fi
            echo "retrying (attempt $attempt)..."
            sleep 10
          done

          if "$scythe_bin" this-is-not-a-real-subcommand >/dev/null 2>&1; then
            echo "expected non-zero exit code from an invalid subcommand" >&2
            exit 1
          fi

  publish_npm:
    name: Publish npm
    needs: [meta, release_assets, smoke_wrappers]
    if: >-
      always() && needs.meta.result == 'success'
      && needs.release_assets.result != 'failure'
      && needs.smoke_wrappers.result == 'success'
      && needs.meta.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # ~keep OIDC trusted publishing needs npm >= 11.5.1, and Node 22 still bundles
      # npm 10. `npm@latest` is npm 12, whose engines are
      # `^22.22.2 || ^24.15.0 || >=26.0.0` -- satisfied only by the newest Node
      # 22 patches, so it turns an unrelated setup-node resolution into an
      # EBADENGINE failure. npm 11 is the newest line that runs on all of Node 22.
      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@11

      - name: Set package version
        working-directory: release/npm
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: release/npm
        # This repository has no NPM_TOKEN, so publishing goes through npm's OIDC
        # trusted publishing.
        #
        # NODE_AUTH_TOKEN must be empty AND unset: `setup-node` with a
        # `registry-url` writes an .npmrc containing
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and with no such
        # variable in the environment npm sends the literal unexpanded string as a
        # token rather than falling through to OIDC. uncomment, ai-rulez and
        # basemind all clear it the same way.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

  publish_pypi:
    name: Publish PyPI
    needs: [meta, release_assets, smoke_wrappers]
    if: >-
      always() && needs.meta.result == 'success'
      && needs.release_assets.result != 'failure'
      && needs.smoke_wrappers.result == 'success'
      && needs.meta.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Set package version
        working-directory: release/pypi
        run: python3 scripts/set_version.py "${{ needs.meta.outputs.version }}"

      - name: Build
        working-directory: release/pypi
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/pypi/dist
          # The meta job's pypi_exists probe is a single check with a race window
          # against index propagation and re-runs. Without this, an upload that
          # loses that race fails the job with a 400 instead of no-opping.
          skip-existing: true
