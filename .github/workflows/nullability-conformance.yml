name: Nullability Conformance

# Checks the analyzer's nullability inference against what the engines
# actually return, rather than against the analyzer's own model. See
# crates/scythe-conformance/src/lib.rs for the four assertions.
#
# The analyzer paths are deliberately in the path filter: a change to
# crates/scythe-core/src/analyzer/** is exactly what this suite exists to
# catch, so it must gate those PRs and not only changes to the suite itself.
#
# parser/** and dialect.rs are here for the same reason. Inference does not
# read SQL text; it reads the parse tree, and it branches on the dialect. So a
# parser or dialect change alters what the analyzer concludes just as directly
# as editing the analyzer does -- and until they were listed, exactly that
# change sailed past the suite built to catch it.
on:
  push:
    branches: [main]
    paths:
      - "crates/scythe-conformance/**"
      - "crates/scythe-core/src/analyzer/**"
      - "crates/scythe-core/src/catalog/**"
      - "crates/scythe-core/src/parser/**"
      - "crates/scythe-core/src/dialect.rs"
      - "testing_data/nullability_live/**"
      - ".github/workflows/nullability-conformance.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/scythe-conformance/**"
      - "crates/scythe-core/src/analyzer/**"
      - "crates/scythe-core/src/catalog/**"
      - "crates/scythe-core/src/parser/**"
      - "crates/scythe-core/src/dialect.rs"
      - "testing_data/nullability_live/**"
      - ".github/workflows/nullability-conformance.yml"
  workflow_dispatch:

concurrency:
  group: nullability-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No container: SQLite runs in-memory, so this leg is nearly free and is
  # the one that fails fastest when the suite itself is broken.
  sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SQLite conformance leg
        run: cargo test -p scythe-conformance --features sqlite,live-tests --test live -- --nocapture

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scythe
          POSTGRES_PASSWORD: scythe
          POSTGRES_DB: scythe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCYTHE_CONFORMANCE_POSTGRES_URL: postgres://scythe:scythe@localhost:5432/scythe_test

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run PostgreSQL conformance leg
        run: cargo test -p scythe-conformance --features pg,live-tests --test live -- --nocapture

  # The admin URL is root, not the per-app `scythe` user: the runner
  # isolates itself into a dedicated database it creates, and the app user
  # in these images is scoped to `scythe_test` only.
  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scythe
          MYSQL_DATABASE: scythe_test
          MYSQL_USER: scythe
          MYSQL_PASSWORD: scythe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCYTHE_CONFORMANCE_MYSQL_ADMIN_URL: mysql://root:scythe@127.0.0.1:3306/

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run MySQL conformance leg
        run: cargo test -p scythe-conformance --features mysql,live-tests --test live -- --nocapture

  mariadb:
    name: MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: scythe
          MARIADB_DATABASE: scythe_test
          MARIADB_USER: scythe
          MARIADB_PASSWORD: scythe
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SCYTHE_CONFORMANCE_MARIADB_ADMIN_URL: mysql://root:scythe@127.0.0.1:3306/

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run MariaDB conformance leg
        run: cargo test -p scythe-conformance --features mariadb,live-tests --test live -- --nocapture

  # `sa`, not a per-app login: the runner isolates itself into a database it
  # creates per connection, which only an admin login can do. The image,
  # password and health check are the ones integration.yml already uses for
  # this engine.
  mssql:
    name: SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Scythe_Test1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Scythe_Test1' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SCYTHE_CONFORMANCE_MSSQL_ADMIN_URL: "sqlserver://sa:Scythe_Test1@localhost:1433?database=master"

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SQL Server conformance leg
        run: cargo test -p scythe-conformance --features mssql,live-tests --test live -- --nocapture

  # Oracle needs two things no other leg does. The container is slow to
  # report healthy, hence the 20 retries (200s) integration.yml also gives
  # it. And `sibyl` links against OCI, so the Instant Client must be
  # installed and on the linker and loader paths before `cargo test` --
  # the same install block and the same LD_LIBRARY_PATH/RUSTFLAGS wiring as
  # integration.yml's Oracle job, minus sqlplus, which that job needs only
  # to apply a schema file and this one does not (the runner applies its own
  # schema through the driver).
  #
  # The credential is `system`, not the `scythe` app user integration.yml
  # uses: in Oracle a schema *is* a user, so isolating this suite means
  # CREATE USER plus grants, which the app user cannot do.
  oracle:
    name: Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: scythe
          APP_USER: scythe
          APP_USER_PASSWORD: scythe
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      SCYTHE_CONFORMANCE_ORACLE_ADMIN_URL: oracle://system:scythe@localhost:1521/XEPDB1

    steps:
      - uses: actions/checkout@v7

      - name: Install Oracle Instant Client
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1t64 alien
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 || true
          wget -q https://download.oracle.com/otn_software/linux/instantclient/2340000/oracle-instantclient-basic-23.4.0.24.05-1.el9.x86_64.rpm
          wget -q https://download.oracle.com/otn_software/linux/instantclient/2340000/oracle-instantclient-devel-23.4.0.24.05-1.el9.x86_64.rpm
          sudo alien -i oracle-instantclient-basic-*.rpm
          sudo alien -i oracle-instantclient-devel-*.rpm
          sudo ln -sf libclntsh.so.23.1 /usr/lib/oracle/23/client64/lib/libclntsh.so
          echo "/usr/lib/oracle/23/client64/lib" | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Set Oracle library paths
        run: |
          echo "LD_LIBRARY_PATH=/usr/lib/oracle/23/client64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L/usr/lib/oracle/23/client64/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Oracle conformance leg
        run: cargo test -p scythe-conformance --features oracle,live-tests --test live -- --nocapture
