name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # Pinned rather than relying on the runner image's default python:
      # scripts/check-provenance-versions.py imports `tomllib`, which is 3.11+.
      # On an older interpreter the step would fail with an ImportError that
      # looks nothing like the version mismatch it exists to report.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Until now `version:check` ran only in publish.yaml, *after* the release
      # tag was already pushed -- see the comment at publish.yaml:72-78, which
      # records that v0.10.0 and v0.11.0 both shipped five crates instead of
      # six because of it. A gate that runs after the irreversible step is not
      # a gate. It stays in publish.yaml as a last line of defence; this is the
      # one that can actually stop a bad release, because it runs on every push
      # and pull request while the mistake is still cheap to fix.
      - name: Check crate versions and inter-crate pins
        run: task version:check
      # `generated-freshness` (below) proves this by actually regenerating
      # everything, which takes real toolchains and ~20 minutes. This step
      # catches the one specific, recurring failure mode -- a version bump
      # that forgot to regenerate, so committed provenance headers still name
      # the old release -- in seconds, from text already on disk, so it fails
      # fast on the release commit instead of waiting on the expensive job.
      #
      # This used to be ~40 lines of inline shell that scanned
      # `integration_tests/` and nothing else, while 28 generated snippets
      # under `website/src/content/docs/` carry the same header (#129). A
      # release that regenerated one tree and not the other passed. The script
      # scans both, and errors per-root when a root yields zero headers -- a
      # total count guard is not enough once there is more than one root,
      # because adding a root that matches nothing is then invisible.
      - name: Check provenance header versions match Cargo.toml
        run: python3 scripts/check-provenance-versions.py
      # The fixture suite used to be committed in two byte-identical places --
      # scythe-cli's and scythe-codegen's `tests/generated/`, produced by the
      # same generator with a different `--output` -- but only the scythe-cli
      # copy was regenerated here, which is exactly how the scythe-codegen
      # copy silently fell 3312 lines behind the fixtures and started failing
      # on main. scythe-codegen is the only surviving copy now.
      - name: Generate integration tests from fixtures
        run: |
          cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-codegen/tests/generated
          cargo fmt --all
      # The directory is committed and .gitignore deliberately re-includes it,
      # but every job in this file regenerates before use and nothing ever
      # compared the result against the committed copy. So a fixture edited
      # without regenerating passed CI green: the tests that ran were the
      # fresh ones built from the edited fixture, while the stale files a
      # reviewer actually read in the diff were never executed by anything.
      # This is `generated-freshness`'s `git status --porcelain` gate (below)
      # applied to the repository's *other* generator, which had none.
      #
      # It runs here rather than in a job of its own because the step above
      # already does the two expensive halves -- regenerate, then `cargo fmt
      # --all` so the comparison is against formatted output, which is what is
      # committed.
      - name: Fail if committed generated tests are stale
        run: |
          dir=crates/scythe-codegen/tests/generated
          # Count the committed files first. If the generator wrote nothing at
          # all -- a `--fixtures` path that stopped matching, an output
          # directory renamed -- and the committed set were also empty, then
          # `git status --porcelain` would be empty too, which reads
          # identically to "everything is fresh". Same vacuous-pass guard as
          # the provenance check above.
          count=$(git ls-files -- "$dir" | wc -l)
          echo "Comparing $count committed generated test file(s) in $dir against a fresh generator run."
          if [ "$count" -eq 0 ]; then
            echo "::error::No committed files under $dir/. That directory is tracked on purpose (see .gitignore), so an empty set means this freshness check would pass vacuously. Run 'cargo run -p test-generator -- --fixtures testing_data --output $dir', 'cargo fmt --all', and commit the result."
            exit 1
          fi
          # `--porcelain`, not `git diff`: this must also catch a brand-new
          # test file the generator creates from scratch (a new fixture
          # category) that nobody committed, which is untracked and therefore
          # invisible to `git diff`.
          status=$(git status --porcelain -- "$dir")
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- "$dir"
            echo "::error::Committed generated tests in $dir are stale. A fixture under testing_data/ changed without regenerating. Run 'cargo run -p test-generator -- --fixtures testing_data --output $dir', then 'cargo fmt --all', and commit the result."
            exit 1
          fi
          echo "All $count committed generated test file(s) in $dir match a fresh generator run."
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
      # `deny.toml` has existed for a long time and no workflow ever invoked it.
      # The `Goldziher/poly@v0` step in the test job below installs poly to put
      # its bundled checkers on PATH; it does not run `poly lint`, so the
      # cargo-deny pass that runs locally never ran here.
      #
      # Both flags are load-bearing, and neither is optional:
      #
      #   --all-features            `tiberius` reaches the graph only through
      #                             scythe-conformance's optional `mssql`
      #                             feature. Without this, `cargo deny check`
      #                             prints "advisories ok" while four RUSTSEC
      #                             advisories in that chain are invisible to
      #                             it -- a gate that passes because it cannot
      #                             see what it is checking.
      #   -D advisory-not-detected  an ignore entry that no longer matches
      #                             anything is a warning by default, so
      #                             deny.toml's ignore list would decay into
      #                             fiction with no signal. This fails the
      #                             build on a stale entry, which is what makes
      #                             the list self-expiring rather than
      #                             self-perpetuating.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Audit dependencies
        run: cargo deny --all-features check -D advisory-not-detected

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every checker `validate_with_tools` (scythe-codegen/src/validation.rs)
      # drives must be on PATH here, because the test step runs it in strict
      # mode, where a missing tool fails instead of silently skipping.
      #
      # `poly` covers most of it. It bundles its engines in-process -- oxc for
      # TypeScript, ruff for Python, mago for PHP -- so one binary replaces the
      # separate `biome`, `ruff` and `php` installs this job used to carry, and
      # it is already this repository's linter. That leaves only the checkers
      # poly delegates rather than bundles.
      - uses: Goldziher/poly@v0
      # gofmt ships with the Go toolchain and `ruby -c` with Ruby, so these two
      # setup actions cost nothing beyond what poly does not cover. Both were
      # previously relied on implicitly from the runner image, which meant an
      # image change could disarm them with no signal.
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      # node and tsc are for the `javascript-*` JSDoc backends only: #81
      # requires the output to parse under real `node` and to typecheck under
      # `tsc --checkJs --strict`. poly's oxc lints JavaScript but does not
      # typecheck JSDoc annotations, so tsc is not redundant with it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install TypeScript
        run: npm install -g typescript
      # `elixirc` compiles the six `elixir-*` backends. Without it this job ran
      # in strict mode while every one of them reported "no checker ran" -- the
      # exact silent-coverage-loss strict mode exists to prevent.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      # Fail loudly here rather than inside a test, so a checker that did not
      # install is diagnosed as an install problem instead of as a dozen
      # confusing backend failures.
      #
      # `javac` and `kotlinc` come from the runner image rather than a setup
      # step. They are listed anyway: an image that stops shipping either one
      # should fail here by name, not as a pile of per-backend assertions.
      #
      # `php` and `python3` back the same real-execution checks as `ruby`
      # above (composite_text_escaping_regression.rs,
      # sql_literal_injection_regression.rs): the emitted parser is run
      # against real PostgreSQL output, not just string-matched. Both also
      # come from the runner image. Those two tests now fail under strict
      # mode when the interpreter is absent, so this step is a better
      # diagnostic rather than the only signal -- keep both, since a name
      # here beats a stack trace from ten backends there.
      - name: Verify every checker is on PATH
        run: |
          set -euo pipefail
          missing=""
          for tool in poly node tsc gofmt ruby elixirc javac kotlinc php python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok      $tool"
            else
              echo "MISSING $tool"
              missing="$missing $tool"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Generated-code checkers not installed:$missing. SCYTHE_VALIDATE_STRICT=1 below would fail with per-backend errors instead of naming the real cause."
            exit 1
          fi
      - name: Generate integration tests from fixtures
        run: cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-codegen/tests/generated
      - name: Run tests
        # Strict mode: a checker that is not installed fails the run instead of
        # being silently skipped. This is what stops a tool from falling out of
        # the image and taking its coverage with it, unnoticed.
        env:
          SCYTHE_VALIDATE_STRICT: "1"
        run: cargo test --workspace
      # `scythe-conformance`'s default feature set is `[]` (see its Cargo.toml),
      # so `cargo test --workspace` above never compiles `src/executors/mssql.rs`
      # (behind `#[cfg(feature = "mssql")]`) at all -- its unit tests (e.g.
      # `is_null_reports_true_for_every_absent_value`) have never run in any CI
      # job. `nullability-conformance.yml`'s mssql job doesn't cover this either:
      # it passes `--test live`, which restricts cargo to that one integration
      # target and excludes the lib unit tests. `tiberius` (behind `mssql`) is
      # pure Rust over `rustls`, so this needs no service container or native
      # library install, unlike the live mssql leg.
      - name: Run scythe-conformance unit tests with the mssql driver compiled in
        run: cargo test -p scythe-conformance --features mssql --lib

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate integration tests from fixtures
        run: cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-codegen/tests/generated
      - name: Build
        run: cargo build --workspace --release

  generated-freshness:
    name: "Validate: Generated Integration Code"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # check-generated-syntax.sh runs in --strict mode below (CI=true also
      # implies strict), so every checker it looks for must actually be on
      # PATH here -- otherwise a missing toolchain silently no-ops the guard
      # it exists to provide instead of failing loudly.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Build scythe
        run: |
          cargo build --release -p scythe-cli
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      # Two generators feed integration_tests/. This one renders the project
      # scaffolding and test harnesses from tools/integration-test-generator/templates/.
      - name: Regenerate integration scaffolding and code
        working-directory: integration_tests
        run: task generate:all
      # A formatter once reflowed the templates as prose, which produced
      # harnesses whose string literals were split across lines. That reached CI
      # as unrelated-looking compiler errors, so parse the output directly.
      # --harness-only: this job only installs the toolchains the four
      # scaffolding checks need (python/go/ruby/php). The generated *query*
      # code -- everything check-generated-syntax.sh checks without this flag
      # -- is covered by the "Validate: Generated Query Code" job below,
      # which installs the full ten-language toolchain instead.
      - name: Syntax-check generated harnesses
        run: ./scripts/check-generated-syntax.sh --strict --harness-only
      # The integration jobs test the committed files and never regenerate, so
      # drift here means CI is validating output no current build produces.
      - name: Fail if regeneration changed anything
        run: |
          # `git status --porcelain` (not `git diff`) so this also catches backends
          # that regeneration creates from scratch as untracked files -- e.g. a new
          # entry in build_backends() with no committed generated/ output yet. Note
          # the generator never deletes: a backend removed from build_backends()
          # leaves its old directory behind untouched, which this check will not flag.
          status=$(git status --porcelain -- integration_tests/)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::Committed integration code is stale or incomplete. Run 'cd integration_tests && task generate:all' and commit the result. If a backend directory is untracked here, it is new output that must be committed; if you removed a backend, its old directory must be deleted by hand."
            exit 1
          fi

  validate-generated-queries:
    name: "Validate: Generated Query Code"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # 115 committed files under integration_tests/**/generated/,
      # integration_tests/*/src/queries.rs and the Java/Kotlin generated/
      # trees were compiled by nothing in CI: `generated-freshness` above
      # only syntax-checks the *hand-written harnesses* it regenerates, and
      # its 4-language toolchain (python/go/ruby/php) can't reach the other
      # six. This job checks the query code actually committed, as
      # committed -- it does not regenerate first, unlike the job above,
      # because the point is to catch what a reviewer approved without a
      # compiler ever having looked at it.
      #
      # Toolchain setup below is the validate-snippets block verbatim (that
      # job independently needed all ten languages for the same reason:
      # compiling committed output with no live database).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      # pnpm 9 rejects the generated `pnpm-workspace.yaml`: it carries only
      # `allowBuilds` settings and no `packages:` key, which pnpm 9 treats as a
      # fatal "packages field missing or empty" while pnpm 10+ accepts it as a
      # settings-only workspace file. Pinned at 9, this job failed all 21
      # typescript projects before reading a single generated file.
      #
      # `install: false` because there is no package.json at the repository
      # root -- every project under integration_tests/ runs its own
      # `pnpm install --frozen-lockfile`, and the cache key is keyed off those
      # per-project lockfiles rather than a root one that does not exist.
      - uses: pnpm/setup@v2
        with:
          version: "11"
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: integration_tests/*/pnpm-lock.yaml
      # No standalone kotlinc here any more: generated Kotlin is checked by a
      # real `gradle compileKotlin` against each project, which resolves the
      # Kotlin compiler through the project's own plugin. See the Kotlin note
      # in scripts/check-generated-syntax.sh for why the bare-compiler check
      # had to go. `gradle` comes from the runner image, like `javac`.
      - name: Install TypeScript
        run: npm install -g typescript
      # `rbs parse` is the RBS-signature syntax checker (script comment has
      # the full rationale); the gem is not part of a stock Ruby install.
      - name: Install rbs
        run: gem install rbs --no-document
      # Same rationale as generated-freshness's "Verify every checker is on
      # PATH": name the missing installer, not the dozen confusing
      # downstream compiler errors it would otherwise produce once
      # check-generated-syntax.sh runs in --strict mode.
      - name: Verify every checker is on PATH
        run: |
          set -euo pipefail
          missing=""
          for tool in php ruby python3 gofmt gradle rbs pnpm dotnet cargo mvn mix; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok      $tool"
            else
              echo "MISSING $tool"
              missing="$missing $tool"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Generated-query-code checkers not installed:$missing."
            exit 1
          fi
      # allowBuilds (pnpm-workspace.yaml.jinja:1) first appeared in pnpm 10.26 and
      # became the sole build-permission mechanism in pnpm 11 (onlyBuiltDependencies
      # etc. removed). Below that floor an unknown `allowBuilds` key is silently
      # ignored -- exit 0, no warning -- and better-sqlite3/oracledb's postinstall
      # builds are skipped. csproj.jinja pins net10.0; without this check a
      # dotnet-version drift back toward 8.0 could still build silently by falling
      # back to a pre-existing SDK 10 on the runner image.
      - name: Verify pnpm and dotnet satisfy the pinned template floors
        run: |
          set -euo pipefail
          resolved_pnpm="$(pnpm --version)"
          pnpm_major="${resolved_pnpm%%.*}"
          pnpm_rest="${resolved_pnpm#*.}"
          pnpm_minor="${pnpm_rest%%.*}"
          if [ "$pnpm_major" -lt 10 ] || { [ "$pnpm_major" -eq 10 ] && [ "$pnpm_minor" -lt 26 ]; }; then
            echo "::error::pnpm $resolved_pnpm predates allowBuilds (needs >=10.26); pnpm-workspace.yaml's allowBuilds key would be silently ignored."
            exit 1
          fi
          if ! dotnet --list-sdks | grep -qE '^10\.'; then
            echo "::error::No .NET 10 SDK resolved; csproj.jinja's net10.0 TargetFramework requires one."
            exit 1
          fi
      - name: Compile/type-check every committed generated query file
        run: ./scripts/check-generated-syntax.sh --strict
      # Committed output is checked against sql/pg/schema.sql (29 lines, one
      # enum, a handful of scalar columns) above -- too narrow to reach the
      # type/identifier shapes several known codegen defects live in (#146).
      # This regenerates every postgresql-engine backend fresh, into a
      # scratch copy, against sql/torture/schema.sql instead, and real-build
      # checks the result the same way the step above does.
      #
      # This is a hard gate, not `continue-on-error: true` -- a step that
      # cannot fail is the exact anti-pattern the rest of this job exists to
      # eliminate (see Taskfile.yaml's old `cargo check --workspace
      # 2>/dev/null || true`). 1 of the 27 postgresql-engine projects
      # currently fails against the torture schema -- do not trust this count
      # without re-running the script, it has been wrong twice: it read "24 of
      # 25" and then "5 of 25" while the allowlist held five entries and then
      # one. The script compares
      # against the checked-in scripts/torture-expected-failures.txt instead
      # of a plain pass/fail count: a listed project failing is a known,
      # already-reported defect and does not fail this step; an unlisted
      # project failing is a regression and does; a listed project that now
      # PASSES means the allowlist is stale and also fails this step, so the
      # list is forced to shrink as backends are fixed instead of quietly
      # rotting once nobody remembers to prune it.
      - name: Build scythe
        run: cargo build --release -p scythe-cli
      - name: Compile-check every backend against the torture schema (issue #146)
        run: python3 scripts/check-generated-backends.py

  # #127: `check-generated-syntax.sh` above (and `validate_with_tools` in
  # crates/scythe-codegen/src/validation.rs) prove Python/PHP/Ruby/Elixir
  # generated code *parses* -- `python3 -m py_compile`, `php -l`, `ruby -c`,
  # `elixirc`/`mix compile`. None of those are a *type* checker: they cannot
  # catch a declared type that the code cannot actually produce, which is
  # exactly the shape of the two defects that shipped in the TypeScript/JS
  # output this week (caught only because `tsc --checkJs --strict` -- a real
  # type checker -- was pointed at richer input than a bare parse). This job
  # adds real type checking for the two languages where it turned out to be
  # reachable without inventing a fake driver, and documents -- rather than
  # papering over -- the two where it is not.
  #
  # Python and PHP: every backend below already has a committed, real
  # per-project dependency manifest under integration_tests/*/ (pyproject.toml
  # + uv.lock; composer.json), the same mechanism `check-generated-syntax.sh`
  # already uses to resolve TypeScript/C#/Rust/Java/Elixir driver types via a
  # real project build instead of a hand-written stub. `uv sync`/
  # `composer install` install the *real* driver package from that manifest,
  # so the type checker below sees the actual `psycopg`/`amphp-postgres`
  # types, not a stand-in.
  #
  # Ruby and Elixir are not in this job:
  #
  #   - Ruby: `pg`, `mysql2`, `sqlite3`, `trilogy`, `oci8` and `tiny_tds` have
  #     no signatures in ruby/gem_rbs_collection (checked directly against
  #     that repository -- zero `gems/<name>` entries for any of them), so
  #     `steep check` has nothing to resolve `PG::Connection` et al. against
  #     and would fail on every file, always, regardless of what scythe
  #     generates -- the inverse of a vacuous pass, but just as useless as a
  #     gate. `rbs validate` was tried as a lighter alternative and rejected:
  #     it exits 0 even when a referenced class (`PG::NoSuchClassXYZ`,
  #     substituted for `PG::Connection` in a throwaway copy) does not exist
  #     anywhere in the loaded environment, so it validates nothing about
  #     driver types either. Fixing this needs a hand-authored RBS stub for
  #     each driver, reviewed by whoever owns the ruby-* backends -- out of
  #     scope here.
  #   - Elixir: `mix compile` (already run by `check-generated-syntax.sh`'s
  #     `check_project`, with the real `postgrex`/`myxql`/etc. dependency
  #     resolved via `mix deps.get`) is a real compile, not a Dialyzer-style
  #     success-typing check. Driving `dialyzer` directly against the
  #     project's compiled `.beam` files (no `mix.exs` edit, since
  #     `dialyxir` -- the library that makes this work reliably -- is not a
  #     dependency of any committed integration project) crashes inside
  #     `dialyzer_utils:get_core_from_beam/2` on this toolchain: Elixir's
  #     `debug_info` chunk format needs `dialyxir`'s translation to be read
  #     back, which raw `dialyzer` does not have. Adding `dialyxir` to the
  #     generated `mix.exs` template is a real fix, but it belongs in
  #     `tools/integration-test-generator/templates/`, not here.
  validate-generated-types:
    name: "Validate: Generated Type Checking"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      # Pinned phar download (same pattern as this file's "Install Kotlin"
      # step below) rather than `composer global require`: none of the
      # committed `composer.json` files may be edited to add a dev
      # dependency, and a global require would still mutate the runner's
      # composer state on every run instead of fetching one pinned artifact.
      - name: Install PHPStan
        run: |
          curl -sL https://github.com/phpstan/phpstan/releases/download/2.2.8/phpstan.phar -o /usr/local/bin/phpstan
          chmod +x /usr/local/bin/phpstan
      - name: Verify every checker is on PATH
        run: |
          set -euo pipefail
          missing=""
          for tool in uv php phpstan jq; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok      $tool"
            else
              echo "MISSING $tool"
              missing="$missing $tool"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Generated-type-checking tools not installed:$missing."
            exit 1
          fi
      # pyrefly, not mypy: this repo's own Python type checker (see poly's
      # engine table -- ruff for lint/format, pyrefly for types) is pyrefly.
      # `poly lint` was tried first and rejected: run against both a clean
      # generated file and one with a deliberately wrong return-type
      # annotation, it reports only ruff findings in either case -- pyrefly
      # is not reachable through `poly lint` in the installed poly version,
      # so it is invoked directly here.
      #
      # `-p strict` is not optional. pyrefly's default preset with no
      # `pyrefly.toml` present (`basic`) does not check return-type
      # consistency at all -- verified directly: the same deliberately wrong
      # annotation above produced zero diagnostics under `basic` and two
      # under `-p strict` (`bad-return`, `implicitly-defined-attribute`-style
      # "declared type does not allow None"). `--python-interpreter-path`
      # points pyrefly at the project's own `uv sync`'d venv so it resolves
      # the real installed driver package's types, not a stand-in.
      - name: Type-check generated Python with pyrefly (issue #127)
        run: |
          set -euo pipefail
          failures=0
          # Only backends whose driver ships inline type hints (a `py.typed`
          # marker or equivalent) are listed here. `python-aiomysql` and
          # `python-aiomysql-mariadb` (same `aiomysql` driver, just pointed
          # at a different schema/dsn -- no separate types question) and
          # `python-pyodbc-mssql` are deliberately absent: neither `aiomysql`
          # nor `pyodbc` ships types, no `types-aiomysql`/`types-pyodbc` stub
          # package exists on PyPI (checked against the real index), and
          # pointed at either backend's generated file, `pyrefly check -p
          # strict` reports zero diagnostics even against the same
          # deliberately-wrong return annotation used to prove this step can
          # fail -- because the unresolved import becomes `Unknown`, which
          # pyrefly accepts anywhere. A checker that cannot fail on that
          # input is not a check; wiring it up would be exactly the "reads as
          # coverage, checks nothing" step #127 is about. `python-duckdb`
          # ships `duckdb/py.typed` plus bundled `_duckdb-stubs/*.pyi`
          # (confirmed by inspecting the published wheel directly), so it
          # belongs in this loop like the other typed drivers below.
          #
          # proj:expected-error-count. A non-zero expectation records a real,
          # pre-existing finding this step surfaces rather than introduces --
          # see the inline note below -- and is not a suppression: a count
          # that drops (bug fixed) or rises (regression) both fail this step,
          # mirroring scripts/torture-expected-failures.txt's allowlist
          # discipline elsewhere in this file.
          #
          # Every count below is measured, never assumed. To re-derive one,
          # run from `integration_tests/<proj>`:
          #   uv sync --quiet && uv run --with pyrefly -- pyrefly check -p strict \
          #     --python-interpreter-path .venv/bin/python --output-format=json generated/*.py \
          #     | jq '.errors | length'
          # A `0` here is only meaningful if the checker can reach a non-zero:
          # appending `def f() -> int: return "s"` to a generated file takes
          # the count to 1, confirming pyrefly resolves these imports rather
          # than silently typing them `Unknown`.
          for entry in \
            "python-psycopg3:0" \
            "python-asyncpg:0" \
            "python-aiosqlite:0" \
            "python-oracledb-oracle:0" \
            "python-snowflake:0" \
            "python-asyncpg-redshift:0" \
            "python-duckdb:0" \
            "python-psycopg3-msgspec:0" \
            "python-psycopg3-pydantic:0" \
            "python-psycopg3-redshift:0"; do
            proj="${entry%%:*}"
            expected="${entry##*:}"
            dir="integration_tests/$proj"
            echo "== $proj (pyrefly -p strict)"
            ( cd "$dir" && uv sync --quiet )
            json=$(cd "$dir" && uv run --with pyrefly -- pyrefly check -p strict \
              --python-interpreter-path .venv/bin/python --output-format=json generated/*.py 2>/dev/null || true)
            actual=$(printf '%s' "$json" | jq '.errors | length')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$proj: pyrefly reported $actual error(s), expected $expected."
              printf '%s\n' "$json" | jq -r '.errors[] | "  \(.path):\(.line): \(.concise_description)"'
              if [ "$actual" -lt "$expected" ]; then
                echo "  fewer errors than expected -- if python-snowflake's DeleteOrdersByUser rowcount/int mismatch (#127) was fixed, lower the expected count above."
              fi
              failures=$((failures + 1))
            else
              echo "  ok ($actual error(s), matches expected)"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures Python backend(s) diverged from their expected pyrefly error count."
            exit 1
          fi
      # Level 5, not the repository's own PHPStan-level-9 convention
      # (php-conventions): tried at level 9 first and rejected. Both
      # backends produced findings there, but every one on php-amphp was
      # `missingType.generics` on `Amp\Sql\SqlConnectionPool` -- scythe
      # cannot spell that interface's four type parameters without knowing
      # the caller's own pool configuration, so this is a structural
      # property of the codegen contract, not a bug (the same reasoning
      # `generated-code-poly.toml` already applies to two mago rules for the
      # same reason). Level 5 keeps real argument/return/call-shape checking
      # -- proven below -- while dropping that noise; both backends pass
      # cleanly at level 5 today.
      # php-pdo-mssql and php-pdo-snowflake declare `ext-pdo_sqlsrv`/
      # `ext-pdo_odbc` as platform requirements (composer.json), but neither
      # extension is installed on this runner (the `shivammathur/setup-php`
      # step above requests no extensions) -- and installing the real sqlsrv/
      # odbc driver stack is out of scope for a static-analysis job that never
      # executes generated code. `--ignore-platform-req` skips just the
      # platform check; both composer.json files declare no package
      # dependencies beyond that extension, so `composer install` has nothing
      # else to resolve and succeeds. The flags are harmless no-ops for every
      # other project in the loop, which doesn't declare either requirement.
      - name: Type-check generated PHP with PHPStan (issue #127)
        run: |
          set -euo pipefail
          failures=0
          for proj in \
            php-pdo php-amphp \
            php-amphp-mysql \
            php-pdo-mariadb \
            php-pdo-mssql \
            php-pdo-mysql \
            php-pdo-namespace \
            php-pdo-redshift \
            php-pdo-snowflake \
            php-pdo-sqlite; do
            dir="integration_tests/$proj"
            echo "== $proj (phpstan level 5)"
            ( cd "$dir" && composer install --quiet --no-interaction \
                --ignore-platform-req=ext-pdo_sqlsrv --ignore-platform-req=ext-pdo_odbc )
            if ! ( cd "$dir" && phpstan analyse --level=5 --no-progress generated ); then
              echo "::error::$proj failed phpstan level 5 (issue #127)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

  validate-snippets:
    name: "Validate: Documentation Snippets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install Kotlin
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip -o kotlin.zip
          unzip -q kotlin.zip -d /opt/kotlin
          echo "/opt/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install TypeScript
        run: npm install -g typescript
      - name: Build snippet-runner
        run: cargo build -p snippet-runner --release
      # README.md is in the reference set deliberately. It used to be in
      # neither `-s` nor `-r`, so its ten hand-written generated-code samples
      # were the one place in the repo where example code could rot with no
      # signal -- and they had: the Go block still showed the pre-0.14.0 field
      # casing and typed NUMERIC as *string, and four more blocks were wrong or
      # would not compile as printed. The README now carries a single sample,
      # copied verbatim from committed generated output, and this keeps it that
      # way.
      - name: Validate documentation snippets
        run: ./target/release/snippet-runner validate -s website/src/content/docs README.md -L syntax --timeout 120
