name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # Until now `version:check` ran only in publish.yaml, *after* the release
      # tag was already pushed -- see the comment at publish.yaml:72-78, which
      # records that v0.10.0 and v0.11.0 both shipped five crates instead of
      # six because of it. A gate that runs after the irreversible step is not
      # a gate. It stays in publish.yaml as a last line of defence; this is the
      # one that can actually stop a bad release, because it runs on every push
      # and pull request while the mistake is still cheap to fix.
      - name: Check crate versions and inter-crate pins
        run: task version:check
      # `generated-freshness` (below) proves this by actually regenerating
      # everything, which takes real toolchains and ~20 minutes. This step
      # catches the one specific, recurring failure mode -- a version bump
      # that forgot to regenerate, so committed provenance headers still name
      # the old release -- in seconds, from text already on disk, so it fails
      # fast on the release commit instead of waiting on the expensive job.
      - name: Check provenance header versions match Cargo.toml
        run: |
          expected=$(awk -F'"' '/^version = /{print $2; exit}' crates/scythe-cli/Cargo.toml)
          if [ -z "$expected" ]; then
            echo "::error::Could not read version from crates/scythe-cli/Cargo.toml" >&2
            exit 1
          fi
          # `while read` fed by a here-string, not by a pipe: a *pipeline*
          # runs its loop in a subshell, so `count`/`offenders` set inside it
          # would vanish once the pipeline exits and this would report success
          # even when it found a mismatch -- see `version:check` in
          # Taskfile.yaml for the same failure mode. A here-string keeps the
          # loop in this shell while still splitting on newlines only, so a
          # path containing a space stays one filename. Iterating unquoted
          # `$files` would split on spaces too, and does not split at all
          # under zsh, which makes the check silently scan one bogus path.
          files=$(grep -rlE 'scythe:provenance v=[0-9]+\.[0-9]+\.[0-9]+' integration_tests/ 2>/dev/null || true)
          count=0
          offenders=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            count=$((count + 1))
            v=$(grep -oE 'scythe:provenance v=[0-9]+\.[0-9]+\.[0-9]+' "$f" | head -1 | sed -E 's/^.*v=//')
            if [ "$v" != "$expected" ]; then
              offenders="${offenders}${f}: v=${v} (expected v=${expected})\n"
            fi
          done <<< "$files"
          echo "Checked $count committed provenance header(s) under integration_tests/."
          # A grep that matches nothing also "passes". Before the artifacts
          # were regenerated this check scanned zero files and reported
          # success, which reads identically to "every header agrees" -- so
          # assert it found something. Any regression that stops the header
          # being emitted, or that empties integration_tests/, now fails here
          # instead of silently disarming this job.
          if [ "$count" -eq 0 ]; then
            echo "::error::Found no scythe:provenance headers under integration_tests/. Generated artifacts are expected to carry one, so this check would pass vacuously. Run 'cd integration_tests && task generate:all' and commit the result."
            exit 1
          fi
          if [ -n "$offenders" ]; then
            printf "%b" "$offenders" >&2
            echo "::error::Provenance header version mismatch: expected v=$expected (from crates/scythe-cli/Cargo.toml) but at least one committed artifact under integration_tests/ disagrees -- see files above. Run 'task version:sync VERSION=$expected' (which regenerates integration_tests) or 'cd integration_tests && task generate:all' and commit the result."
            exit 1
          fi
          echo "All $count provenance header(s) agree on v=$expected"
      - name: Generate integration tests from fixtures
        run: |
          cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-cli/tests/generated
          cargo fmt --all
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every checker `validate_with_tools` (scythe-codegen/src/validation.rs)
      # drives must be on PATH here, because the test step runs it in strict
      # mode, where a missing tool fails instead of silently skipping.
      #
      # `poly` covers most of it. It bundles its engines in-process -- oxc for
      # TypeScript, ruff for Python, mago for PHP -- so one binary replaces the
      # separate `biome`, `ruff` and `php` installs this job used to carry, and
      # it is already this repository's linter. That leaves only the checkers
      # poly delegates rather than bundles.
      - uses: Goldziher/poly@v0
      # gofmt ships with the Go toolchain and `ruby -c` with Ruby, so these two
      # setup actions cost nothing beyond what poly does not cover. Both were
      # previously relied on implicitly from the runner image, which meant an
      # image change could disarm them with no signal.
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      # node and tsc are for the `javascript-*` JSDoc backends only: #81
      # requires the output to parse under real `node` and to typecheck under
      # `tsc --checkJs --strict`. poly's oxc lints JavaScript but does not
      # typecheck JSDoc annotations, so tsc is not redundant with it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript
        run: npm install -g typescript
      # Fail loudly here rather than inside a test, so a checker that did not
      # install is diagnosed as an install problem instead of as a dozen
      # confusing backend failures.
      - name: Verify every checker is on PATH
        run: |
          set -euo pipefail
          missing=""
          for tool in poly node tsc gofmt ruby; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "ok      $tool"
            else
              echo "MISSING $tool"
              missing="$missing $tool"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Generated-code checkers not installed:$missing. SCYTHE_VALIDATE_STRICT=1 below would fail with per-backend errors instead of naming the real cause."
            exit 1
          fi
      - name: Generate integration tests from fixtures
        run: cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-cli/tests/generated
      - name: Run tests
        # Strict mode: a checker that is not installed fails the run instead of
        # being silently skipped. This is what stops a tool from falling out of
        # the image and taking its coverage with it, unnoticed.
        env:
          SCYTHE_VALIDATE_STRICT: "1"
        run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate integration tests from fixtures
        run: cargo run -p test-generator -- --fixtures testing_data --output crates/scythe-cli/tests/generated
      - name: Build
        run: cargo build --workspace --release

  generated-freshness:
    name: "Validate: Generated Integration Code"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      # check-generated-syntax.sh runs in --strict mode below (CI=true also
      # implies strict), so every checker it looks for must actually be on
      # PATH here -- otherwise a missing toolchain silently no-ops the guard
      # it exists to provide instead of failing loudly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Build scythe
        run: |
          cargo build --release -p scythe-cli
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      # Two generators feed integration_tests/. This one renders the project
      # scaffolding and test harnesses from tools/integration-test-generator/templates/.
      - name: Regenerate integration scaffolding and code
        working-directory: integration_tests
        run: task generate:all
      # A formatter once reflowed the templates as prose, which produced
      # harnesses whose string literals were split across lines. That reached CI
      # as unrelated-looking compiler errors, so parse the output directly.
      - name: Syntax-check generated harnesses
        run: ./scripts/check-generated-syntax.sh --strict
      # The integration jobs test the committed files and never regenerate, so
      # drift here means CI is validating output no current build produces.
      - name: Fail if regeneration changed anything
        run: |
          # `git status --porcelain` (not `git diff`) so this also catches backends
          # that regeneration creates from scratch as untracked files -- e.g. a new
          # entry in build_backends() with no committed generated/ output yet. Note
          # the generator never deletes: a backend removed from build_backends()
          # leaves its old directory behind untouched, which this check will not flag.
          status=$(git status --porcelain -- integration_tests/)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::Committed integration code is stale or incomplete. Run 'cd integration_tests && task generate:all' and commit the result. If a backend directory is untracked here, it is new output that must be committed; if you removed a backend, its old directory must be deleted by hand."
            exit 1
          fi

  validate-snippets:
    name: "Validate: Documentation Snippets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install Kotlin
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip -o kotlin.zip
          unzip -q kotlin.zip -d /opt/kotlin
          echo "/opt/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install TypeScript
        run: npm install -g typescript
      - name: Build snippet-runner
        run: cargo build -p snippet-runner --release
      # README.md is in the reference set deliberately. It used to be in
      # neither `-s` nor `-r`, so its ten hand-written generated-code samples
      # were the one place in the repo where example code could rot with no
      # signal -- and they had: the Go block still showed the pre-0.14.0 field
      # casing and typed NUMERIC as *string, and four more blocks were wrong or
      # would not compile as printed. The README now carries a single sample,
      # copied verbatim from committed generated output, and this keeps it that
      # way.
      - name: Validate documentation snippets
        run: ./target/release/snippet-runner validate -s website/src/content/docs README.md -L syntax --timeout 120
