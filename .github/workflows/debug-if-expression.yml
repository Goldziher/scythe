name: Debug If Expression

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  meta:
    name: base
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=0.20.1" >> "$GITHUB_OUTPUT"

  gated:
    name: gated but always
    needs: [meta]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo gated

  downstream_exact:
    name: exact publish.yaml condition
    needs: [meta, gated]
    if: needs.gated.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    steps:
      - run: echo downstream_exact
