name: Inspect (live PG)

on:
  push:
    branches: [main]
    paths:
      - "crates/scythe-inspect/**"
      # Drift-rule default severities live here, and the live drift suite
      # asserts them.
      - "crates/scythe-lint/src/rules/drift.rs"
      - ".github/workflows/inspect-live.yml"
  pull_request:
    paths:
      - "crates/scythe-inspect/**"
      - "crates/scythe-lint/src/rules/drift.rs"
      - ".github/workflows/inspect-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pg:
    name: live-pg-${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 12-alpine
          - 14-alpine
          - 16-alpine
          - 17-alpine

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: scythe
          POSTGRES_PASSWORD: scythe
          POSTGRES_DB: scythe_inspect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      # Runs pg_live.rs (catalog checks), verify_live.rs (query verification)
      # and schema_diff_live.rs (schema drift) in one pass. All three gate on
      # the `live-tests` feature plus $SCYTHE_TEST_DATABASE_URL, so they
      # compile away entirely wherever no postgres service exists.
      - name: Run scythe-inspect live tests
        env:
          SCYTHE_TEST_DATABASE_URL: postgres://scythe:scythe@localhost:5432/scythe_inspect_test
        run: cargo test -p scythe-inspect --features live-tests -- --test-threads=1
