# Until this file existed there was no scheduled dependency maintenance at all.
# Every Dependabot run on this repo was `event: dynamic` -- that is, triggered
# by a security alert and nothing else. Ordinary version updates were never
# proposed, so dependencies moved only when an advisory forced them, which is
# the most expensive moment to discover that a bump does not build.
#
# Updates are grouped aggressively and scheduled weekly on purpose. This repo
# has a Cargo workspace of seven crates plus two release wrappers; ungrouped
# daily updates would open a PR storm that trains everyone to ignore the label.
#
# Every manifest under integration_tests/ (go.mod, pom.xml, build.gradle.kts,
# package.json, pyproject.toml, Cargo.toml, Gemfile, composer.json, *.csproj)
# is rendered output -- generated by
# tools/integration-test-generator/templates/*.jinja, not hand-written.
# Dependabot has no way to know that, so any ecosystem scoped at (or scanning
# into) integration_tests/ gets it opening PRs that edit generated files
# directly. Those PRs cannot merge cleanly: the next `task generate:all` run
# reverts them, and the `generated-freshness` CI job fails the diff in the
# meantime. This is why maven and gradle are deliberately NOT configured as
# ecosystems below -- their only manifests in this repo live under
# integration_tests/, and Dependabot cannot be pointed at a jinja template
# instead of the file it renders. The cargo/npm/uv ecosystems below are safe
# because their `directory` is scoped to real, hand-written manifests
# ("/", "/release/npm", "/release/pypi") and none of them reach into
# integration_tests/.
#
# To bump a dependency version used by generated integration tests (for
# example a JDBC driver or a Go module), edit the corresponding template
# under tools/integration-test-generator/templates/ and regenerate --
# do not edit the file under integration_tests/ directly.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: for a workspace this size the interesting
      # signal is "does everything still build and pass", which one PR answers
      # as well as twenty. Majors stay separate because they are the ones that
      # need a human to read a changelog.
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # tiberius 0.12 hard-pins the rustls 0.21 line, which transitively pins
      # rustls-webpki 0.101.7 and makes its advisory permanently
      # `security_update_not_possible`. It is not worth churning: tiberius
      # reaches only two unpublished places -- crates/scythe-conformance
      # (publish = false, behind the optional `mssql` feature) and
      # integration_tests/rust-tiberius-mssql -- so no published scythe
      # artifact carries the vulnerable path. Moving off it is tracked
      # separately; a weekly PR that cannot succeed is pure noise.
      - dependency-name: tiberius
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/release/npm"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/release/pypi"
    schedule:
      interval: weekly
      day: monday
    groups:
      pypi-minor-and-patch:
        update-types: ["minor", "patch"]
