# Until this file existed there was no scheduled dependency maintenance at all.
# Every Dependabot run on this repo was `event: dynamic` -- that is, triggered
# by a security alert and nothing else. Ordinary version updates were never
# proposed, so dependencies moved only when an advisory forced them, which is
# the most expensive moment to discover that a bump does not build.
#
# Updates are grouped aggressively and scheduled weekly on purpose. This repo
# has a Cargo workspace of seven crates plus two release wrappers; ungrouped
# daily updates would open a PR storm that trains everyone to ignore the label.
#
# Every manifest under integration_tests/ (go.mod, pom.xml, build.gradle.kts,
# package.json, pyproject.toml, Cargo.toml, Gemfile, composer.json, *.csproj)
# is rendered output -- generated by
# tools/integration-test-generator/templates/*.jinja, not hand-written.
# Dependabot has no way to know that, so any ecosystem scoped at (or scanning
# into) integration_tests/ gets it opening PRs that edit generated files
# directly. Those PRs cannot merge cleanly: the next `task generate:all` run
# reverts them, and the `generated-freshness` CI job fails the diff in the
# meantime. This is why go, maven, gradle, npm (for integration_tests/),
# pip, bundler, and packagist/composer are deliberately NOT configured as
# ecosystems below -- Dependabot cannot be pointed at a jinja template
# instead of the file it renders. The cargo/npm/uv ecosystems below are safe
# because their `directory` is scoped to real, hand-written manifests
# ("/", "/release/npm", "/release/pypi") and none of them reach into
# integration_tests/.
#
# Renovate (repo-root renovate.json) covers the gap instead: its
# customManagers regex managers read the version pins directly out of
# tools/integration-test-generator/templates/*.jinja (the source of truth),
# so bumps land in the template and flow out through the next `task
# generate:all`, exactly like a hand-edit would. It also runs two native
# managers, each scoped to one hand-maintained real manifest outside the
# generator: gradle for integration_tests/kotlin-jdbc-ext/build.gradle.kts,
# and composer for integration_tests/php-pdo-namespace/composer.json. Both
# scopes are anchored to that single path, so they cannot pick up the
# generated manifests beside them -- which would reintroduce exactly the
# problem this split exists to solve.
# Renovate's enabledManagers is deliberately narrowed to ["custom.regex",
# "gradle", "composer"] so it never touches the cargo/github-actions/npm/uv
# ecosystems Dependabot already owns below -- no duplicate PRs from the two
# bots. Major bumps are ungrouped so each gets its own PR, matching the
# majors/minor split configured below for the same reason.
#
# To bump a dependency version used by generated integration tests (for
# example a JDBC driver or a Go module), edit the corresponding template
# under tools/integration-test-generator/templates/ and regenerate --
# do not edit the file under integration_tests/ directly. Renovate PRs
# against renovate.json's custom-manager targets do this automatically.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: for a workspace this size the interesting
      # signal is "does everything still build and pass", which one PR answers
      # as well as twenty. Majors stay separate because they are the ones that
      # need a human to read a changelog.
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # tiberius 0.12 hard-pins the rustls 0.21 line, which transitively pins
      # rustls-webpki 0.101.7 and makes its advisory permanently
      # `security_update_not_possible`. It is not worth churning: tiberius
      # reaches only two unpublished places -- crates/scythe-conformance
      # (publish = false, behind the optional `mssql` feature) and
      # integration_tests/rust-tiberius-mssql -- so no published scythe
      # artifact carries the vulnerable path. Moving off it is tracked
      # separately; a weekly PR that cannot succeed is pure noise.
      - dependency-name: tiberius
        update-types: ["version-update:semver-major"]

  # Security updates are `event: dynamic` -- an advisory triggers them against
  # whatever manifest contains the dependency, whether or not that path is
  # configured above. integration_tests/rust-tiberius-mssql is a standalone
  # cargo project with its own Cargo.lock, outside the root workspace, so the
  # `/` entry's ignore list never reaches it.
  #
  # The result is a job that has failed every week since the advisory landed:
  # the alert is on rustls-webpki, not on tiberius, so the tiberius rule above
  # does not match it. tiberius 0.12 pins the rustls 0.21 line, which pins
  # rustls-webpki 0.101.7; the earliest non-vulnerable release is 0.103.13.
  # Dependabot reports `security_update_not_possible` -- there is no lockfile
  # edit that resolves this, only moving off tiberius, which is tracked
  # separately.
  #
  # An `ignore: rustls-webpki` entry here does NOT silence it, and was removed
  # after being tried: Dependabot applies the rule (`Ignored versions: >= 0 -
  # from .github/dependabot.yml`) and then fails the job with
  # `all_versions_ignored`. That trades one red run for another, and the
  # replacement error names the config instead of the advisory. The only thing
  # that actually stops the weekly failure is dismissing the alert in the
  # repository's Dependabot alerts view, which is a maintainer decision, not a
  # config change -- nothing published carries the vulnerable path, since this
  # project is generated test-harness code that never ships.
  #
  # That decision was taken on 2026-08-14: alerts #137, #138 and #139 are
  # dismissed as `not_used`, matching #134-#136 against the root Cargo.lock.
  # Do not re-open them expecting a fix; Dependabot's own log reports
  # `security_update_not_possible` with an empty `conflicting-dependencies`
  # list -- latest resolvable 0.101.7 against earliest fixed 0.103.13 -- which
  # means the fixed version is unreachable, not merely unselected. A new alert
  # will be filed for each new rustls-webpki advisory and will need the same
  # decision until the move off tiberius lands.
  #
  # `open-pull-requests-limit: 0` still earns its place: it keeps ordinary
  # version updates off a generated manifest (see the header). Drop this entry
  # when the move off tiberius lands.
  - package-ecosystem: cargo
    directory: "/integration_tests/rust-tiberius-mssql"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/release/npm"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/release/pypi"
    schedule:
      interval: weekly
      day: monday
    groups:
      pypi-minor-and-patch:
        update-types: ["minor", "patch"]
