[project]
name = "scythe-sql"
version = "0.0.0"
description = "SQL compilation and code generation CLI -- PyPI wrapper that downloads the prebuilt scythe binary"
readme = "README.md"
license = "MIT"
# 3.10, not 3.9. Three reasons, any one of which is sufficient: 3.9 reached
# end of life in October 2025; this repo's own Python convention is 3.10+; and
# the floor was making Dependabot fail permanently with
# `dependency_file_not_resolvable`, because the dev group asks for
# `pytest>=8.0.0` while pytest 9 requires >=3.10 -- an unsatisfiable pair.
# Nothing is lost by raising it: this package is a wrapper that downloads a
# prebuilt binary and shells out to it, so it has no Python-version-sensitive
# code of its own.
requires-python = ">=3.10"
authors = [{ name = "Na'aman Hirschfeld" }]
keywords = ["sql", "codegen", "cli", "database", "sqlc"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://goldziher.github.io/scythe"
Repository = "https://github.com/Goldziher/scythe"
Issues = "https://github.com/Goldziher/scythe/issues"

[project.scripts]
scythe = "scythe_sql.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scythe_sql"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
