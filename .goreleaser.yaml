version: 2

before:
  hooks:
    - cargo fetch --locked
    # ~keep The cluster-scope gate ships both pinned PostgreSQL grammars beside the
    # ~keep binary; build them for every release target before GoReleaser archives.
    - task pg:parsers:all

builds:
  - builder: rust
    dir: .
    tool: ./scripts/cargo-release
    command: zigbuild
    flags:
      - --release
      - --package=scythe-cli
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu
    binary: scythe

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Target }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # ~keep Both pinned grammars ship next to the binary so `scythe audit
      # ~keep --cluster-scope` works from an extracted archive. The helpers are
      # ~keep built only for the four POSIX targets: upstream libpg_query 15/18
      # ~keep cannot be cross-compiled to windows-gnu (its vendored PostgreSQL
      # ~keep headers include POSIX socket headers the Windows libc lacks), so the
      # ~keep Windows directory carries a note instead and the gate reports the
      # ~keep helpers unavailable there.
      - src: "dist/pg-parsers/{{ .Target }}/*"
        strip_parent: true
      - src: "crates/scythe-cli/src/commands/audit/PARSER_PROTOCOL.md"
        dst: .

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: scythe
    repository:
      owner: Goldziher
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Goldziher/scythe
    description: "Polyglot SQL-to-code generator with built-in linting and formatting"
    license: MIT
    install: |
      bin.install "scythe"
    test: |
      system "#{bin}/scythe", "--version"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
